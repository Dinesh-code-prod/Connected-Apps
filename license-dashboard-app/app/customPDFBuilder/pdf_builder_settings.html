    // ════════════════════════════════════════════════════════════════════
    //  RULE BUILDER — compile/decompile, field catalogue, save/load
    //  (DECISIONS #35 — replaces matrix + separate criteria panel)
    // ════════════════════════════════════════════════════════════════════

    // Predefined condition fields: State / Application / Role.
    // `dataType` is a sentinel used only by the rule machinery here in settings —
    // these fields never appear in advancedFilterFields and are never written to
    // the criteria[] array; they compile to layer1.tokens[] instead.
    const PREDEFINED_RULE_FIELDS = [
      { name: "__state__",  displayName: "State",       dataType: "__STATE__"  },
      { name: "__app__",    displayName: "Application", dataType: "__APP__"    },
      { name: "__role__",   displayName: "Role",        dataType: "__ROLE__"   },
    ];

    function isPredefinedField(fieldName) {
      return PREDEFINED_RULE_FIELDS.some(f => f.name === fieldName);
    }

    // Options for a predefined field row in the rule editor.
    function predefinedFieldOptions(fieldName) {
      if (fieldName === "__state__") {
        return moduleStates.value.map(s => ({ value: s.status, label: s.displayName }));
      }
      if (fieldName === "__app__") {
        return dynamicApplications.value.map(a => ({ value: a.value, label: a.label }));
      }
      if (fieldName === "__role__") {
        // Merge roles from all cached apps (rule can span apps)
        const seen = new Set();
        const out = [];
        for (const roles of Object.values(appRolesCache.value)) {
          for (const r of (roles || [])) {
            if (!seen.has(r.name)) { seen.add(r.name); out.push({ value: r.name, label: r.label || r.name }); }
          }
        }
        return out;
      }
      return [];
    }

    // Operators available for a rule row.
    function ruleOperatorsForRow(row) {
      return isPredefinedField(row.field) ? PREDEFINED_OPERATORS : CRITERIA_OPERATORS;
    }

    // Multi-value operator check for rule rows.
    function ruleRowIsMulti(row) {
      const ops = ruleOperatorsForRow(row);
      const op = ops.find(o => o.label === row.operatorLabel);
      return !!op?.multi;
    }

    // Value options for a rule row (predefined OR module-field).
    function ruleRowValueOptions(row) {
      if (!row?.field) return [];
      if (isPredefinedField(row.field)) return predefinedFieldOptions(row.field);
      const dt = _ruleFieldDataType(row.field);
      if (dt === "LOOKUP") return criteriaLookupOptions.value[row.field] || [];
      return criteriaFieldOptions(row.field);
    }

    function _ruleFieldDataType(fieldName) {
      const f = criteriaFields.value.find(x => x.name === fieldName);
      return f ? String(f.dataType || "").toUpperCase() : "";
    }

    const CRITERIA_ELIGIBLE_TYPES = new Set([
      "ENUM", "SYSTEM_ENUM", "BOOLEAN", "LOOKUP",
      "STRING", "NUMBER", "DECIMAL", "BIG_STRING",
    ]);

    function isCriteriaEligibleField(f) {
      const dt = String(f?.dataType || "").toUpperCase();
      if (!dt || dt === "ID") return false;
      if (dt.startsWith("MULTI")) return false;
      return CRITERIA_ELIGIBLE_TYPES.has(dt);
    }

    function criteriaFieldOptions(fieldName) {
      const f = criteriaFields.value.find(x => x.name === fieldName);
      if (!f) return [];
      const dt = String(f.dataType || "").toUpperCase();
      if (dt === "BOOLEAN") {
        return [{ value: "true", label: "Yes" }, { value: "false", label: "No" }];
      }
      if (dt === "ENUM" || dt === "SYSTEM_ENUM") {
        return (f.options || []).map(o => ({
          value: String(o.value != null ? o.value : (o.index != null ? o.index : o.id)),
          label: String(o.label != null ? o.label : (o.displayName != null ? o.displayName : o.value)),
        }));
      }
      return [];
    }

    async function fetchAdvancedFilterFields(moduleLink) {
      if (criteriaFieldsCache.value[moduleLink]) return criteriaFieldsCache.value[moduleLink];
      const url = `/v2/fields/config/advancedFilterFields/${encodeURIComponent(moduleLink)}`;
      settingsLog("info", "API GET advancedFilterFields (start)", { module: moduleLink, url });
      const resp = await window.facilioApp.request.invokeFacilioAPI(url, { method: "GET" });
      settingsLog("info", "API GET advancedFilterFields (full response)", { module: moduleLink, resp });
      apiLog(`Advanced filter fields (${moduleLink})`, url, "GET", resp);
      if (resp?.error) throw new Error("advancedFilterFields failed: " + JSON.stringify(resp.error));
      const all = resp?.result?.fields || resp?.fields || [];
      const eligible = all.filter(isCriteriaEligibleField);
      criteriaFieldsCache.value = { ...criteriaFieldsCache.value, [moduleLink]: eligible };
      settingsLog("info", "advancedFilterFields loaded", { module: moduleLink, total: all.length, eligible: eligible.length });
      return eligible;
    }

    async function ensureLookupOptions(fieldName) {
      const f = criteriaFields.value.find(x => x.name === fieldName);
      if (!f) return;
      const dt = String(f.dataType || "").toUpperCase();
      if (dt !== "LOOKUP") return;
      if (criteriaLookupOptions.value[fieldName]) return;
      const lookupMod = f.lookupModule?.name || f.lookupModuleName || f.lookupModule;
      if (!lookupMod) {
        settingsLog("warn", "LOOKUP field missing lookupModule.name", { fieldName, field: f });
        return;
      }
      criteriaLookupLoading.value = { ...criteriaLookupLoading.value, [fieldName]: true };
      try {
        // #105: `page=1&perPage=200` REMOVED. There was no pagination loop, so a lookup module
        // with more than 200 records silently offered only the first 200 as condition values —
        // an admin simply could not build a rule against anything past them, with nothing in
        // the UI saying so.
        const url = `/v3/modules/${encodeURIComponent(lookupMod)}?withCount=true`;
        settingsLog("info", "API GET lookup records (start)", { fieldName, lookupMod, url });
        const resp = await window.facilioApp.request.invokeFacilioAPI(url, { method: "GET" });
        apiLog(`Lookup records (${lookupMod})`, url, "GET", resp);
        if (resp?.error) throw new Error(JSON.stringify(resp.error));
        const list = resp?.data?.[lookupMod] || resp?.[lookupMod] || resp?.result?.[lookupMod] || [];
        const opts = (Array.isArray(list) ? list : []).map(r => ({
          value: String(r.id),
          label: String(r.name != null ? r.name : (r.subject != null ? r.subject : (r.displayName != null ? r.displayName : r.id))),
        }));
        criteriaLookupOptions.value = { ...criteriaLookupOptions.value, [fieldName]: opts };
        settingsLog("info", "lookup records loaded", { fieldName, lookupMod, count: opts.length });
      } catch (e) {
        settingsLog("error", "Failed to load lookup records", { fieldName, message: e.message });
        notifyUser("Failed to load values for " + fieldName + ": " + (e.message || "see console").slice(0, 120), "error");
        criteriaLookupOptions.value = { ...criteriaLookupOptions.value, [fieldName]: [] };
      } finally {
        criteriaLookupLoading.value = { ...criteriaLookupLoading.value, [fieldName]: false };
      }
    }

    // ── Compile: rule rows → {tokens, criteria} → buildStateApp envelope ──
    // App conditions can never be *All (spec constraint A).
    // State/Role with no condition → *All wildcard.
    // Expand across all known apps if no App condition (save-time expansion).
    function compileRuleToStateApp(rows, isBulkPrint) {
      const validRows = rows.filter(r => r.field && Array.isArray(r.value) && r.value.length);

      // Partition predefined vs module-field rows
      const stateRows  = validRows.filter(r => r.field === "__state__");
      const appRows    = validRows.filter(r => r.field === "__app__");
      const roleRows   = validRows.filter(r => r.field === "__role__");
      const fieldRows  = validRows.filter(r => !isPredefinedField(r.field));

      // Collect distinct sets
      const stateSet = stateRows.length ? [...new Set(stateRows.flatMap(r => r.value))] : null;  // null = *All
      const appSet   = appRows.length   ? [...new Set(appRows.flatMap(r => r.value))]   : null;  // null = all known apps
      const roleSet  = roleRows.length  ? [...new Set(roleRows.flatMap(r => r.value))]  : null;  // null = *All

      // No conditions of ANY kind → no Layer-1 tokens at all.
      // Without this, the app-expansion below turns an empty condition list into
      // "*All_<app>_*All" for every known app — the match-every-record wildcard. That was
      // technically reachable before (save an empty rule) but never the normal flow; with
      // bulk print, "tick the checkbox and add no conditions" IS the normal flow, and it
      // must not silently make the template the universal auto-load default for the app.
      // A field-only rule (fieldRows present, no State/App/Role) still expands as before —
      // that expansion exists so field-only defaults can match, and it is unchanged.
      if (!stateRows.length && !appRows.length && !roleRows.length && !fieldRows.length) {
        return buildStateApp([], [], isBulkPrint);
      }

      // Resolve app set: if no app condition, expand to all known apps at save time
      const effectiveApps = appSet || dynamicApplications.value.map(a => a.value);
      if (!effectiveApps.length) effectiveApps.push("FACILIO"); // ultimate fallback

      // Cross-product: for each app × state × role
      const tokens = [];
      for (const appToken of effectiveApps) {
        const states = stateSet || ["*All"];
        const roles  = roleSet  || ["*All"];
        for (const state of states) {
          for (const role of roles) {
            tokens.push(`${state}_${appToken}_${role}`);
          }
        }
      }

      // Serialize module-field rows into criteria[]
      const criteria = fieldRows.map(r => ({
        field: r.field,
        dataType: r.dataType,
        operatorId: Number(r.operatorId),
        value: r.value.map(String),
        label: (Array.isArray(r.label) ? r.label : []).map(String),
      }));

      return buildStateApp(tokens, criteria, isBulkPrint);
    }

    // ── Decompile: envelope → rule rows (for re-opening) ──
    // Returns { rows, scattered, scatteredTokens, isBulkPrint }
    // scattered=true means the token set is not a clean cross-product; rows will be empty
    // and scatteredTokens carries the raw list for display.
    // isBulkPrint rides ALONGSIDE rows — never as a ruleRows entry, because
    // compileRuleToStateApp partitions rows into the State/App/Role cross-product and a
    // non-condition row there would corrupt the token product.
    function parseStateAppToRule(raw) {
      const { tokens, criteria, isBulkPrint } = parseStateApp(raw);

      // No tokens and no criteria — but a bulk-print-only rule is still a real rule,
      // so isBulkPrint must survive this early return.
      if (!tokens.length && !criteria.length) {
        return { rows: [], scattered: false, scatteredTokens: [], isBulkPrint };
      }

      // Detect scattered: parse all tokens and check clean cross-product
      let rows = [];
      let scattered = false;
      let scatteredTokens = [];

      if (tokens.length) {
        const parsed = tokens.map(t => parseToken(t)).filter(Boolean);
        if (parsed.length !== tokens.length) {
          // Some tokens unparseable
          scattered = true;
          scatteredTokens = tokens;
        } else {
          // Collect distinct sets
          const appSet   = [...new Set(parsed.map(p => p.appToken))];
          const stateSet = [...new Set(parsed.map(p => p.status))];
          const roleSet  = [...new Set(parsed.map(p => p.roleName))];

          // Clean cross-product check: expected count = appSet × stateSet × roleSet
          const expected = appSet.length * stateSet.length * roleSet.length;
          if (expected !== tokens.length) {
            scattered = true;
            scatteredTokens = tokens;
          } else {
            // Verify every combination exists
            const tokenSet = new Set(tokens);
            let clean = true;
            for (const a of appSet) {
              for (const s of stateSet) {
                for (const r of roleSet) {
                  if (!tokenSet.has(`${s}_${a}_${r}`)) { clean = false; break; }
                }
                if (!clean) break;
              }
              if (!clean) break;
            }
            if (!clean) {
              scattered = true;
              scatteredTokens = tokens;
            } else {
              // Build predefined rows from the cross-product
              // App row (always — spec: App can't be *All, but *All is a wildcard from old matrix)
              // If all apps are *All, omit app row (field-only rule); otherwise add app row
              const allWildcardApp = appSet.length === 1 && appSet[0] === "*All";
              if (!allWildcardApp) {
                // Resolve labels
                const appLabels = appSet.map(v => dynamicApplications.value.find(a => a.value === v)?.label || v);
                const opLabel = appSet.length > 1 ? "is any of" : "is";
                rows.push({ field: "__app__", dataType: "__APP__", operatorId: 9, operatorLabel: opLabel, value: appSet, label: appLabels });
              }

              // State row (omit if *All)
              const allWildcardState = stateSet.length === 1 && stateSet[0] === "*All";
              if (!allWildcardState) {
                const stateLabels = stateSet.map(v => moduleStates.value.find(s => s.status === v)?.displayName || v);
                const opLabel = stateSet.length > 1 ? "is any of" : "is";
                rows.push({ field: "__state__", dataType: "__STATE__", operatorId: 9, operatorLabel: opLabel, value: stateSet, label: stateLabels });
              }

              // Role row (omit if *All)
              const allWildcardRole = roleSet.length === 1 && roleSet[0] === "*All";
              if (!allWildcardRole) {
                const allRoles = Object.values(appRolesCache.value).flat();
                const roleLabels = roleSet.map(v => allRoles.find(r => r.name === v)?.label || v);
                const opLabel = roleSet.length > 1 ? "is any of" : "is";
                rows.push({ field: "__role__", dataType: "__ROLE__", operatorId: 9, operatorLabel: opLabel, value: roleSet, label: roleLabels });
              }
            }
          }
        }
      }

      // Append module-field rows from criteria[]
      for (const c of (Array.isArray(criteria) ? criteria : [])) {
        const opLabel = c.operatorId === 10
          ? "is not"
          : (Array.isArray(c.value) && c.value.length > 1 ? "is any of" : "is");
        rows.push({
          field: c.field,
          dataType: c.dataType,
          operatorId: c.operatorId,
          operatorLabel: opLabel,
          value: Array.isArray(c.value) ? c.value.map(String) : (c.value != null ? [String(c.value)] : []),
          label: Array.isArray(c.label) ? c.label.map(String) : (c.label != null ? [String(c.label)] : []),
        });
      }

      return { rows, scattered, scatteredTokens: scattered ? scatteredTokens : [], isBulkPrint };
    }

    // ── Summary line for the per-template rule list ──
    function ruleSummary(tpl) {
      const { tokens, criteria, isBulkPrint } = parseStateApp(tpl?.[CONFIG.fields.stateApplication]);
      const parts = [];
      // Listed first: it is the most consequential property of the rule, and a template
      // may carry ONLY this (no tokens, no criteria) — see ruleConditionCount.
      if (isBulkPrint) parts.push("Bulk print");
      if (tokens.length) {
        const parsed = tokens.map(t => parseToken(t)).filter(Boolean);
        const apps   = [...new Set(parsed.map(p => p.appToken).filter(v => v !== "*All"))];
        const states = [...new Set(parsed.map(p => p.status).filter(v => v !== "*All"))];
        const roles  = [...new Set(parsed.map(p => p.roleName).filter(v => v !== "*All"))];
        if (apps.length) {
          const labels = apps.map(v => dynamicApplications.value.find(a => a.value === v)?.label || v);
          parts.push(labels.join(" / "));
        }
        if (states.length) {
          const labels = states.map(v => moduleStates.value.find(s => s.status === v)?.displayName || v);
          parts.push("State: " + labels.join(", "));
        }
        if (roles.length) {
          parts.push("Role: " + roles.join(", "));
        }
      }
      if (criteria.length) {
        const first = criteria[0];
        const allRoles = Object.values(appRolesCache.value).flat();
        let valDisplay = "";
        if (Array.isArray(first.label) && first.label.length) valDisplay = first.label.join(", ");
        else if (Array.isArray(first.value) && first.value.length) valDisplay = first.value.join(", ");
        parts.push(`${first.field} is ${valDisplay}`);
        if (criteria.length > 1) parts.push(`+${criteria.length - 1}`);
      }
      return parts.join(" · ") || "—";
    }

    // Count effective conditions for a template. Drives three things: the "Add rule" vs
    // "Edit rule" button label, the "No rule — template never auto-loaded" list text, and
    // whether the dialog offers "Clear rule". A bulk-print-only template has zero tokens
    // and zero criteria but IS a configured rule, so the flag counts — otherwise it would
    // read as "no rule" and stay invisible until someone opened the dialog.
    function ruleConditionCount(tpl) {
      if (!tpl) return 0;
      const { tokens, criteria, isBulkPrint } = parseStateApp(tpl[CONFIG.fields.stateApplication]);
      return tokens.length + (criteria?.length || 0) + (isBulkPrint ? 1 : 0);
    }

    /** Is this template flagged as its module's bulk-export default? (list badge) */
    function isTemplateBulkPrint(tpl) {
      if (!tpl) return false;
      return parseStateApp(tpl[CONFIG.fields.stateApplication]).isBulkPrint;
    }

    /**
     * Name of the OTHER template in this module currently holding bulk print, or "" if none.
     * Drives the "saving will move it" warning in the rule editor, so the takeover is
     * disclosed before the user commits rather than only reported afterwards.
     */
    const bulkPrintHolderName = computed(() => {
      const moduleLink = defaultsModule.value;
      if (!moduleLink) return "";
      const holder = templates.value.find(
        t => t?.id && t.id !== ruleEditorTemplateId.value &&
             rowModuleLink(t) === moduleLink && isTemplateBulkPrint(t),
      );
      return holder ? rowName(holder) : "";
    });

    // Does this template have scattered (non-cross-product) tokens?
    function ruleHasScatteredTokens(tpl) {
      if (!tpl) return false;
      const { tokens } = parseStateApp(tpl[CONFIG.fields.stateApplication]);
      if (!tokens.length) return false;
      const { scattered } = parseStateAppToRule(tpl[CONFIG.fields.stateApplication]);
      return scattered;
    }

    // ── Persist ──
    async function persistStateApplication(templateId, jsonValue) {
      const api = window.facilioApp?.api;
      if (!api?.updateRecord) {
        throw new Error("facilioApp.api.updateRecord not available on this SDK build.");
      }
      settingsLog("info", "api.updateRecord stateApplication (start)", { id: templateId, stateApplication: jsonValue });
      const resp = await api.updateRecord(CONFIG.templateModule, {
        id: templateId,
        data: { [CONFIG.fields.stateApplication]: jsonValue },
      });
      apiLog("Update stateApplication", `PUT /v3/modules/${CONFIG.templateModule}/${templateId}`, "PUT", resp);
      if (resp?.error) {
        throw new Error(typeof resp.error === "string" ? resp.error : JSON.stringify(resp.error));
      }
      if (resp != null && resp.code != null && Number(resp.code) !== 0 && resp.code !== "0") {
        throw new Error("Update failed code: " + String(resp.code));
      }
      const idx = templates.value.findIndex(t => t.id === templateId);
      if (idx >= 0) {
        templates.value[idx] = { ...templates.value[idx], [CONFIG.fields.stateApplication]: jsonValue };
      }
    }

    // ── Roles / Applications (kept — still needed by rule editor) ──
    async function fetchRolesForApp(appToken) {
      if (!appToken) return;
      if (Array.isArray(appRolesCache.value[appToken]) && appRolesCache.value[appToken].length) return;
      const appId = appIdMap.value[appToken];
      if (!appId) {
        settingsLog("warn", "Roles fetch skipped — no appId for token", appToken);
        return;
      }
      try {
        const url = `/setup/roles?appId=${encodeURIComponent(appId)}`;
        settingsLog("info", "API GET roles (start)", { appToken, appId, url });
        const resp = await window.facilioApp.request.invokeFacilioAPI(url, { method: "GET" });
        settingsLog("info", "API GET roles (full response)", { appToken, resp });
        apiLog("Roles list", url, "GET", resp);
        const rolesArr = resp?.roles;
        if (!Array.isArray(rolesArr)) throw new Error("Roles response missing roles array");
        const mapped = rolesArr.map(r => ({ label: r.label || r.name || "—", name: r.name }));
        appRolesCache.value = { ...appRolesCache.value, [appToken]: mapped };
        settingsLog("info", "Roles loaded", { appToken, count: mapped.length });
      } catch (e) {
        settingsLog("error", "Failed to load roles", { appToken, message: e.message, stack: e.stack });
        notifyUser("Failed to load roles: " + (e.message || "see console").slice(0, 180), "error");
      }
    }

    async function fetchApplicationList() {
      try {
        const resp = await window.facilioApp.request.invokeFacilioAPI("/v2/setup/application/list", { method: "GET" });
        apiLog("Application list", "/v2/setup/application/list", "GET", resp);
        const apps = resp?.result?.application || [];
        const seen = {};
        for (const app of apps) {
          if (!app.active) continue;
          const cfg = APP_DOMAIN_CONFIG[app.appDomain?.appDomainTypeEnum];
          if (!cfg) continue;
          const token = cfg.token;
          const priority = app.linkName === cfg.linkName ? 1 : app.isDefault ? 2 : 3;
          if (!seen[token] || priority < seen[token].priority) {
            seen[token] = { appId: app.id, label: cfg.label, priority };
          }
        }
        const list = TOKEN_ORDER.filter(t => seen[t]).map(t => ({ value: t, label: seen[t].label }));
        const idMap = {};
        TOKEN_ORDER.filter(t => seen[t]).forEach(t => { idMap[t] = seen[t].appId; });
        dynamicApplications.value = list;
        appIdMap.value = idMap;
        settingsLog("info", "Application list loaded", { apps: list.map(a => a.value), idMap });
      } catch (e) {
        settingsLog("warn", "fetchApplicationList failed — falling back to current app only", { message: e.message });
        const fallbackToken = Object.entries(APP_DOMAIN_CONFIG)
          .find(([k]) => k === currentAppDomainTypeEnum.value)?.[1]?.token || "FACILIO";
        const fallbackLabel = APP_DOMAIN_CONFIG[currentAppDomainTypeEnum.value]?.label || "Maintenance App";
        dynamicApplications.value = [{ value: fallbackToken, label: fallbackLabel }];
        appIdMap.value = { [fallbackToken]: currentAppDomainId.value };
      }
    }

    async function onDefaultsModuleChange(moduleLink) {
      if (!moduleLink) {
        moduleStates.value = [];
        return;
      }
      defaultsLoading.value = true;
      moduleStates.value = [];
      try {
        const url = `/v2/setup/state/list?parentModuleName=${encodeURIComponent(moduleLink)}`;
        settingsLog("info", "API GET state list (start)", { module: moduleLink, url });
        const resp = await window.facilioApp.request.invokeFacilioAPI(url, { method: "GET" });
        settingsLog("info", "API GET state list (full response)", { module: moduleLink, resp });
        apiLog("State list", url, "GET", resp);
        const statusArr = resp?.result?.status;
        if (!Array.isArray(statusArr)) {
          throw new Error("State list response missing result.status array");
        }
        moduleStates.value = statusArr.map(s => ({
          displayName: s.displayName || s.status || "—",
          status: s.status,
        }));
        settingsLog("info", "States loaded for module", { module: moduleLink, count: moduleStates.value.length });

        const moduleTemplates = templates.value.filter(t => rowModuleLink(t) === moduleLink);
        if (moduleTemplates.length > 0) {
          settingsLog("info", "Enriching templates for defaults module", { module: moduleLink, count: moduleTemplates.length });
          const fullRecords = await Promise.all(moduleTemplates.map(t => fetchTemplateFullRecord(t.id)));
          for (const full of fullRecords) {
            if (!full?.id) continue;
            const idx = templates.value.findIndex(t => t.id === full.id);
            if (idx >= 0) {
              templates.value[idx] = { ...templates.value[idx], ...full };
              settingsLog("info", "Template enriched with full record", {
                id: full.id,
                stateApplication: full[CONFIG.fields.stateApplication],
              });
            }
          }
        }
      } catch (e) {
        settingsLog("error", "Failed to load states for module", { module: moduleLink, message: e.message, stack: e.stack });
        notifyUser("Failed to load module states: " + (e.message || "see console").slice(0, 180), "error");
      } finally {
        defaultsLoading.value = false;
      }
      // Pre-fetch roles for all known apps so the Role value picker works without delay
      for (const app of dynamicApplications.value) {
        fetchRolesForApp(app.value);
      }
    }

    // ── Rule editor open / close / row actions ──
    async function openRuleEditor(template) {
      if (!template?.id) return;
      ruleEditorTemplateId.value = template.id;
      ruleEditorTemplateName.value = rowName(template);
      ruleEditorTemplate.value = template;
      ruleEditorOpen.value = true;
      criteriaFields.value = [];
      ruleRows.value = [];
      ruleEditorScattered.value = false;
      ruleEditorScatteredTokens.value = [];
      ruleBulkPrint.value = false;
      criteriaFieldsLoading.value = true;
      try {
        const tpl = templates.value.find(t => t.id === template.id);
        const moduleLink = rowModuleLink(tpl) || defaultsModule.value;
        criteriaFields.value = await fetchAdvancedFilterFields(moduleLink);
        const { rows, scattered, scatteredTokens, isBulkPrint } = parseStateAppToRule(tpl?.[CONFIG.fields.stateApplication]);
        ruleEditorScattered.value = scattered;
        ruleEditorScatteredTokens.value = scatteredTokens;
        ruleBulkPrint.value = isBulkPrint;
        ruleRows.value = rows;
        // Ensure lookup options for any LOOKUP fields in restored rows
        for (const row of rows) {
          if (!isPredefinedField(row.field) && _ruleFieldDataType(row.field) === "LOOKUP") {
            ensureLookupOptions(row.field);
          }
        }
      } catch (e) {
        settingsLog("error", "Failed to open rule editor", { message: e.message, stack: e.stack });
        notifyUser("Failed to load field list: " + (e.message || "see console").slice(0, 160), "error");
      } finally {
        criteriaFieldsLoading.value = false;
      }
    }

    function closeRuleEditor() {
      ruleEditorOpen.value = false;
      ruleEditorTemplateId.value = null;
      ruleEditorTemplate.value = null;
      ruleRows.value = [];
      ruleEditorScattered.value = false;
      ruleEditorScatteredTokens.value = [];
      ruleBulkPrint.value = false;
    }

    function addRuleRow() {
      ruleRows.value = [
        ...ruleRows.value,
        { field: "", dataType: "", operatorId: 9, operatorLabel: "is", value: [], label: [] },
      ];
    }

    function removeRuleRow(idx) {
      const next = ruleRows.value.slice();
      next.splice(idx, 1);
      ruleRows.value = next;
    }

    function onRuleFieldChange(row) {
      if (isPredefinedField(row.field)) {
        const pf = PREDEFINED_RULE_FIELDS.find(f => f.name === row.field);
        row.dataType = pf?.dataType || "";
        // If role field, ensure roles are loaded for all known apps
        if (row.field === "__role__") {
          for (const app of dynamicApplications.value) fetchRolesForApp(app.value);
        }
      } else {
        row.dataType = _ruleFieldDataType(row.field);
        if (row.dataType === "LOOKUP") ensureLookupOptions(row.field);
      }
      row.operatorLabel = "is";
      row.operatorId = 9;
      row.value = [];
      row.label = [];
    }

    function onRuleOperatorChange(row) {
      const ops = ruleOperatorsForRow(row);
      const op = ops.find(o => o.label === row.operatorLabel) || ops[0];
      row.operatorId = op.id;
      if (!op.multi && row.value.length > 1) {
        row.value = row.value.slice(0, 1);
        row.label = row.label.slice(0, 1);
      }
    }

    function onRuleValueChange(row) {
      const opts = ruleRowValueOptions(row);
      const byVal = {};
      opts.forEach(o => { byVal[o.value] = o.label; });
      row.label = row.value.map(v => byVal[v] != null ? byVal[v] : String(v));
    }

    // Convert scattered legacy tokens → best-effort clean cross-product rows in the editor.
    function simplifyScatteredRule() {
      const tokens = ruleEditorScatteredTokens.value;
      const parsed = tokens.map(t => parseToken(t)).filter(Boolean);
      const appSet   = [...new Set(parsed.map(p => p.appToken).filter(v => v !== "*All"))];
      const stateSet = [...new Set(parsed.map(p => p.status).filter(v => v !== "*All"))];
      const roleSet  = [...new Set(parsed.map(p => p.roleName).filter(v => v !== "*All"))];

      const newRows = [];
      if (appSet.length) {
        const labels = appSet.map(v => dynamicApplications.value.find(a => a.value === v)?.label || v);
        newRows.push({ field: "__app__", dataType: "__APP__", operatorId: 9, operatorLabel: appSet.length > 1 ? "is any of" : "is", value: appSet, label: labels });
      }
      if (stateSet.length) {
        const labels = stateSet.map(v => moduleStates.value.find(s => s.status === v)?.displayName || v);
        newRows.push({ field: "__state__", dataType: "__STATE__", operatorId: 9, operatorLabel: stateSet.length > 1 ? "is any of" : "is", value: stateSet, label: labels });
      }
      if (roleSet.length) {
        const allRoles = Object.values(appRolesCache.value).flat();
        const labels = roleSet.map(v => allRoles.find(r => r.name === v)?.label || v);
        newRows.push({ field: "__role__", dataType: "__ROLE__", operatorId: 9, operatorLabel: roleSet.length > 1 ? "is any of" : "is", value: roleSet, label: labels });
      }
      ruleRows.value = newRows;
      ruleEditorScattered.value = false;
      ruleEditorScatteredTokens.value = [];
    }

    /**
     * One bulk-print template per module. Strips `is_bulk_print` from every OTHER template
     * in the same module, preserving each sibling's own tokens/criteria untouched.
     *
     * This is the ONLY cross-template write in the rule builder — #35 deliberately removed
     * sibling token-stripping, and that stays removed; only this single flag is exclusive.
     * A client-side guard cannot survive two admins saving concurrently, which is why the
     * renderer also tie-breaks deterministically (lowest template id, per specs/bulk-print.md).
     * Returns the display names of the templates it cleared.
     */
    async function clearBulkPrintFlagOnSiblingTemplates(keepTemplateId) {
      const moduleLink = defaultsModule.value;
      if (!moduleLink) return [];
      const clearedNames = [];
      for (const tpl of templates.value) {
        if (!tpl?.id || tpl.id === keepTemplateId) continue;
        if (rowModuleLink(tpl) !== moduleLink) continue;
        const sibling = parseStateApp(tpl[CONFIG.fields.stateApplication]);
        if (!sibling.isBulkPrint) continue;
        await persistStateApplication(tpl.id, buildStateApp(sibling.tokens, sibling.criteria, false));
        clearedNames.push(rowName(tpl));
        settingsLog("info", "Bulk print flag cleared on sibling template", { id: tpl.id, module: moduleLink });
      }
      return clearedNames;
    }

    async function saveRule() {
      const templateId = ruleEditorTemplateId.value;
      if (!templateId) return;
      ruleSaving.value = true;
      const moduleToRefresh = defaultsModule.value;
      try {
        const jsonValue = compileRuleToStateApp(ruleRows.value, ruleBulkPrint.value);
        // Order matters. Clear siblings BEFORE saving this template: if the save below then
        // fails, the module ends up with ZERO flagged templates (the renderer fails loudly
        // and names the module) rather than TWO (the renderer silently tie-breaks and may
        // keep using the template the admin was replacing). Loud failure beats silent wrong.
        let clearedNames = [];
        if (ruleBulkPrint.value) {
          clearedNames = await clearBulkPrintFlagOnSiblingTemplates(templateId);
        }
        await persistStateApplication(templateId, jsonValue);
        settingsLog("info", "Rule saved", { templateId, jsonValue, bulkPrintClearedFrom: clearedNames });
        notifyUser(
          clearedNames.length
            ? `Rule saved. Bulk print moved from ${clearedNames.join(", ")}.`
            : "Rule saved.",
          "success",
        );
        closeRuleEditor();
      } catch (e) {
        settingsLog("error", "Save rule failed", { templateId, message: e.message, stack: e.stack });
        notifyUser("Failed to save rule: " + (formatApiError(e) || e.message || "see console").slice(0, 160), "error");
      } finally {
        ruleSaving.value = false;
      }
      if (moduleToRefresh) {
        await new Promise(r => setTimeout(r, 400));
        await onDefaultsModuleChange(moduleToRefresh);
      }
    }

    async function clearRule() {
      const templateId = ruleEditorTemplateId.value;
      if (!templateId) return;
      ruleSaving.value = true;
      const moduleToRefresh = defaultsModule.value;
      try {
        // Clears is_bulk_print along with tokens and criteria (dev ruling, specs/bulk-print.md):
        // bulk print is authored as a checkbox INSIDE this rule, so clearing the rule clears it
        // too. Deliberate, not incidental — the third arg is passed explicitly and asserted in
        // the round-trip harness. Known consequence: clearing a state/role rule also drops that
        // module out of bulk export.
        const jsonValue = buildStateApp([], [], false);
        await persistStateApplication(templateId, jsonValue);
        settingsLog("info", "Rule cleared (incl. bulk print flag)", { templateId });
        notifyUser("Rule cleared.", "success");
        closeRuleEditor();
      } catch (e) {
        settingsLog("error", "Clear rule failed", { templateId, message: e.message, stack: e.stack });
        notifyUser("Failed to clear rule: " + (formatApiError(e) || e.message || "see console").slice(0, 160), "error");
      } finally {
        ruleSaving.value = false;
      }
      if (moduleToRefresh) {
        await new Promise(r => setTimeout(r, 400));
        await onDefaultsModuleChange(moduleToRefresh);
      }
    }

    // ── v2 Editor — bridge computeds and helpers ──

    // Plain-English summary shown at the top of the editor dialog.
    const ruleEditorSummary = computed(() => {
      const rows = ruleRows.value;
      const appRow   = rows.find(r => r.field === "__app__");
      const roleRow  = rows.find(r => r.field === "__role__");
      const stateRow = rows.find(r => r.field === "__state__");
      const fieldRows = rows.filter(r => r.field && !isPredefinedField(r.field) && r.value?.length);

      const parts = [];
      if (appRow?.value?.length) {
        const labels = appRow.label?.length ? appRow.label : appRow.value.map(v => dynamicApplications.value.find(a => a.value === v)?.label || v);
        parts.push(`in <b>${labels.join(" / ")}</b>`);
      } else {
        parts.push("in <b>any app</b>");
      }
      if (roleRow?.value?.length) {
        const labels = roleRow.label?.length ? roleRow.label : roleRow.value;
        parts.push(`viewed by <b>${labels.join(", ")}</b>`);
      } else {
        parts.push("viewed by <b>anyone</b>");
      }
      if (stateRow?.value?.length) {
        const labels = stateRow.label?.length ? stateRow.label : stateRow.value.map(v => moduleStates.value.find(s => s.status === v)?.displayName || v);
        parts.push(`with status <b>${labels.join(", ")}</b>`);
      } else {
        parts.push("with <b>any status</b>");
      }
      fieldRows.forEach(r => {
        const fDef = criteriaFields.value.find(x => x.name === r.field);
        const fname = fDef?.displayName || r.field;
        const labels = r.label?.length ? r.label : r.value;
        parts.push(`${fname} <b>${r.operatorLabel}</b> ${labels.join(", ")}`);
      });
      return "This template loads automatically when a record is opened " + parts.join(", ") + ".";
    });

    // Bridge computed: array of app values from the __app__ row (multi-app — a rule can serve several apps).
    const ruleApp = computed(() => {
      const row = ruleRows.value.find(r => r.field === "__app__");
      return row?.value || [];
    });

    function setRuleApp(vals) {
      const next = ruleRows.value.filter(r => r.field !== "__app__");
      if (vals && vals.length) {
        const opts = predefinedFieldOptions("__app__");
        const byVal = {};
        opts.forEach(o => { byVal[o.value] = o.label; });
        const labels = vals.map(v => byVal[v] || v);
        const opLabel = vals.length > 1 ? "is any of" : "is";
        next.unshift({ field: "__app__", dataType: "__APP__", operatorId: 9, operatorLabel: opLabel, value: vals, label: labels });
      }
      ruleRows.value = next;
    }

    // Bridge computed: array of role values from the __role__ row.
    const ruleRoles = computed(() => {
      const row = ruleRows.value.find(r => r.field === "__role__");
      return row?.value || [];
    });

    function setRuleRoles(vals) {
      const next = ruleRows.value.filter(r => r.field !== "__role__");
      if (vals && vals.length) {
        const opts = predefinedFieldOptions("__role__");
        const byVal = {};
        opts.forEach(o => { byVal[o.value] = o.label; });
        const labels = vals.map(v => byVal[v] || v);
        const opLabel = vals.length > 1 ? "is any of" : "is";
        next.push({ field: "__role__", dataType: "__ROLE__", operatorId: 9, operatorLabel: opLabel, value: vals, label: labels });
      }
      ruleRows.value = next;
    }

    // Bridge computed: array of state values from the __state__ row.
    const ruleStates = computed(() => {
      const row = ruleRows.value.find(r => r.field === "__state__");
      return row?.value || [];
    });

    function setRuleStates(vals) {
      const next = ruleRows.value.filter(r => r.field !== "__state__");
      if (vals && vals.length) {
        const opts = predefinedFieldOptions("__state__");
        const byVal = {};
        opts.forEach(o => { byVal[o.value] = o.label; });
        const labels = vals.map(v => byVal[v] || v);
        const opLabel = vals.length > 1 ? "is any of" : "is";
        next.push({ field: "__state__", dataType: "__STATE__", operatorId: 9, operatorLabel: opLabel, value: vals, label: labels });
      }
      ruleRows.value = next;
    }

    // Derived view: only the non-predefined rows (module-field conditions).
    const moduleConditionRows = computed(() => {
      return ruleRows.value.filter(r => r.field === "" || !isPredefinedField(r.field));
    });

    function addModuleConditionRow() {
      ruleRows.value = [
        ...ruleRows.value,
        { field: "", dataType: "", operatorId: 9, operatorLabel: "is", value: [], label: [] },
      ];
    }

    function removeModuleConditionRow(condIdx) {
      // condIdx is the index within moduleConditionRows — map back to ruleRows index
      const moduleRows = ruleRows.value
        .map((r, i) => ({ r, i }))
        .filter(({ r }) => r.field === "" || !isPredefinedField(r.field));
      const target = moduleRows[condIdx];
      if (!target) return;
      const next = ruleRows.value.slice();
      next.splice(target.i, 1);
      ruleRows.value = next;
    }

    // serializeCriteriaRows kept for backward compatibility (no other callers, but keep as no-op stub to avoid ReferenceError from any stale console script)
    function serializeCriteriaRows() {
      return ruleRows.value
        .filter(r => r.field && !isPredefinedField(r.field) && Array.isArray(r.value) && r.value.length)
        .map(r => ({
          field: r.field,
          dataType: r.dataType,
          operatorId: Number(r.operatorId),
          value: r.value.map(String),
          label: (Array.isArray(r.label) ? r.label : []).map(String),
        }));
    }

    function cancelEditor() {
      settingsLog("info", "user: cancel editor");
      editingId.value = null;
      appState.value = "list";
      settingsLog("info", "state transition → list", { via: "cancel" });
    }

    async function openPreview(fromSave = false) {
      // #88 — single gate for the whole feature (see PREVIEW_FEATURE_ENABLED at the top).
      // With the flag off, a save must still save: fall straight through to the same
      // `saveTemplate()` the preview footer's confirm button calls. A plain "Preview" click
      // with the flag off cannot happen (the button is `v-if`-gated) but is handled anyway
      // rather than silently doing nothing, since this function is also the save entry point.
      if (!PREVIEW_FEATURE_ENABLED) {
        if (fromSave) await saveTemplate();
        else settingsLog("info", "Preview requested but PREVIEW_FEATURE_ENABLED is false — ignoring.");
        return;
      }
      const nameTrim = templateName.value.trim();
      if (!nameTrim) {
        notifyUser("Please enter a template name before previewing.", "warning");
        return;
      }
      if (!selModule.value?.name) {
        notifyUser("No module selected.", "warning");
        return;
      }
      previewTriggeredBySave.value = fromSave;
      previewOpen.value = true;
    }

    function closePreview() {
      previewOpen.value = false;
      previewTriggeredBySave.value = false;
    }

    function onPreviewIframeLoad() {
      const iframe = previewIframeRef.value;
      if (!iframe?.contentWindow) return;
      const config = buildConfigObject();
      iframe.contentWindow.postMessage({
        type: "PDF_PREVIEW_INIT",
        config: JSON.stringify(config),
        moduleLinkName: selModule.value?.name || "",
        moduleDisplayName: selModule.value?.displayName || "",
        templateName: templateName.value,
      }, "*");
    }

    async function confirmSaveFromPreview() {
      closePreview();
      await saveTemplate();
    }

    function waitForAppLoaded(timeoutMs) {
      return new Promise((resolve, reject) => {
        let settled = false;
        const timeout = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error("app.loaded timeout after " + timeoutMs / 1000 + "s"));
        }, timeoutMs);
        window.facilioApp.on("app.loaded", data => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          resolve(data);
        });
      });
    }

    async function bootstrap() {
      errorMessage.value = "";
      if (typeof window !== "undefined" && window.innerWidth <= 768) {
        appState.value = "mobile-blocked";
        settingsLog("warn", "mobile guard: innerWidth <= 768", { width: window.innerWidth });
        return;
      }

      if (typeof FacilioAppSDK === "undefined") {
        settingsLog("error", "FacilioAppSDK missing");
        errorMessage.value = "Facilio SDK not found. Open this page as a Connected App inside Facilio.";
        appState.value = "error";
        return;
      }

      appState.value = "loading";
      loadingMessage.value = "Initializing SDK…";
      try {
        await loadModuleCustomizations();
        await loadOrgCustomizations();
        settingsLog("info", "FacilioAppSDK.init() (web tab — no resize)");
        window.facilioApp = FacilioAppSDK.init();

        loadingMessage.value = "Waiting for app.loaded…";
        const data = await waitForAppLoaded(APP_LOADED_TIMEOUT_MS);
        settingsLog("info", "app.loaded received (full payload)", data);
        settingsLog("info", "app.loaded keys", Object.keys(data || {}));
        currentAppDomainId.value = data?.currentUser?.applicationId ?? null;
        currentAppDomainTypeEnum.value = data?.currentUser?.appDomain?.appDomainTypeEnum ?? null;

        loadingMessage.value = "Loading templates and modules…";
        const [modRes, tplRes] = await Promise.allSettled([
          fetchModulesIfNeeded(),
          fetchTemplatesList(),
          fetchApplicationList(),
        ]);
        if (tplRes.status === "rejected") {
          throw tplRes.reason;
        }
        if (modRes.status === "rejected") {
          settingsLog("warn", "modules prefetch failed — Module column may show link names until Create is opened", modRes.reason);
        }

        settingsLog("info", "state transition → list (bootstrap complete)");
        appState.value = "list";
      } catch (err) {
        settingsLog("error", "bootstrap failed", { message: err.message, stack: err.stack });
        errorMessage.value = err.message?.includes("timeout")
          ? "Connection timeout — Facilio did not send app.loaded."
          : (err.message || "Failed to initialize.");
        appState.value = "error";
      }
    }

    function retryBootstrap() {
      settingsLog("info", "user: retry bootstrap");
      bootstrap().catch(e => {
        settingsLog("error", "retryBootstrap failed", { message: e.message });
      });
    }

    onMounted(() => {
      settingsLog("info", "onMounted", { innerWidth: window.innerWidth });
      bootstrap().catch(e => {
        settingsLog("error", "bootstrap (onMounted) failed", { message: e.message });
      });
    });

    return {
      PAGE_SIZE,
      appState,
      loadingMessage,
      errorMessage,
      templates,
      listSearch,
      listPage,
      moduleSearch,
      fieldSearch,
      filteredTemplates,
      pagedTemplates,
      totalPages,
      filteredSysMods,
      filteredCustMods,
      selModule,
      templateName,
      editingId,
      confirmDelete,
      confirmDeleteLabel,
      sections,
      saveBusy,
      open,
      dSec,
      dOverSec,
      dField,
      dOverField,
      dOverZone,
      hasComments,
      hasAttachments,
      hasTimeDetails,
      hasTimelog,
      modulePresetSections,
      moduleAttachmentSections,
      attachmentPickerOpen,
      attachmentPickerSelected,
      presetPickerOpen,
      presetPickerSelected,
      pickerStyle,
      onAttachmentsClick,
      closeAttachmentPicker,
      toggleAttachmentPickerOption,
      confirmAttachmentPicker,
      onPresetClick,
      closePresetPicker,
      togglePresetPickerOption,
      confirmPresetPicker,
      moduleFindingSections,
      findingPickerOpen,
      findingPickerSelected,
      onFindingsClick,

      toggleFindingPickerOption,
      confirmFindingPicker,
      isPresetAlreadyAdded,
      addPresetSection,
      specialSectionDescription,
      hasAnyOrgCustomizations,

      orgCustomSignatures,
      orgCustomTables,
      customizationPickerOpen,
      customizationPickerSelected,
      customizationFieldWidget,
      onCustomizationClick,
      closeCustomizationPicker,
      toggleCustomizationOption,
      confirmCustomizationPicker,
      isCustomizationAdded,
      customTableColumnCatalog,
      orderedTableColumnsForPicker,   // #126/#128 — all used bare in the picker template
      onColumnDragStart,
      onColumnDragEnd,
      dropOnColumn,
      dCol,
      dOverCol,
      isTableColumnSelected,
      toggleTableColumn,
      customizationDescription,
      rowName,
      moduleDisplayForRow,
      formatUser,
      formatListDate,
      isAdded,
      toggleAccordionLevel1,
      toggleAccordionLevel2,
      filteredSysFields,
      filteredCustFields,
      fieldSplitReliable,

      widgetOptionsForField,

      goList,
      openDefaults,
      goBackFromDefaults,
      dynamicApplications,
      defaultsModule,
      moduleStates,
      defaultsLoading,

      // Rule builder
      PREDEFINED_RULE_FIELDS,

      ruleEditorOpen,

      ruleSummary,

      ruleHasScatteredTokens,
      ruleBulkPrint,
      isTemplateBulkPrint,
      bulkPrintHolderName,

      saveRule,
      clearRule,
      // v2 editor additions
      ruleEditorSummary,
      ruleApp,
      setRuleApp,
      ruleRoles,

      setRuleStates,
      moduleConditionRows,
      addModuleConditionRow,

      predefinedFieldOptions,

      cancelEditor,
      previewFeatureEnabled,

      previewIframeRef,
      openPreview,
      closePreview,
      onPreviewIframeLoad,
      confirmSaveFromPreview,
      retryBootstrap,
      sectionTypeLabel,
      Math
    };
  }
}).use(ElementPlus).mount("#app");
