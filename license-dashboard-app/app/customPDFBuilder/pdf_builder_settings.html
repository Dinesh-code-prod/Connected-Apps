// Maps API appDomainTypeEnum → short token, display label, and canonical linkName.
// linkName is the stable Facilio-defined identifier for the primary app of each domain type.
// It is used as the first selector in fetchApplicationList so we never accidentally
// pick a non-canonical app (e.g. Data Manager over Maintenance) regardless of isDefault.
const APP_DOMAIN_CONFIG = {
  "FACILIO":       { token: "FACILIO", label: "Maintenance App", linkName: "maintenance" },
  "TENANT_PORTAL": { token: "TENANT",  label: "Tenant App",      linkName: "tenant" },
  "VENDOR_PORTAL": { token: "VENDOR",  label: "Vendor App",      linkName: "vendor" },
  "CLIENT_PORTAL": { token: "CLIENT",  label: "Client App",      linkName: "client" },
};
const TOKEN_ORDER = ["FACILIO", "TENANT", "VENDOR", "CLIENT"];
// Known short-token values — none contain underscores, enabling reliable token parsing
const KNOWN_APP_TOKENS = ["FACILIO", "TENANT", "VENDOR", "CLIENT"];

// Parse "{status}_{appToken}_{roleName}" or wildcard variants. Returns null if unparseable.
function parseToken(token) {
  for (const app of KNOWN_APP_TOKENS) {
    const prefix = `_${app}_`;
    const idx = token.indexOf(prefix);
    if (idx >= 0) {
      return { status: token.slice(0, idx), appToken: app, roleName: token.slice(idx + prefix.length) };
    }
  }
  return null;
}


// ── Layer-1 / Layer-2 storage envelope (ARCHITECTURE §I, DECISIONS #19) ──
// `state_application` is JSON since schemaVersion 2:
//   { schemaVersion:2, layer1:{ tokens:[...] }, criteria:[ {field,dataType,operatorId,value:[],label:[]} ] }
// The Layer-1 matrix machinery thinks in CSV; these helpers unwrap/rewrap so the
// stored field is JSON while criteria are preserved across token edits.
const STATE_APP_SCHEMA_VERSION = 2;

/**
 * Parse a stored value into { tokens:[], criteria:[], isBulkPrint } — JSON or legacy CSV.
 * Never throws.
 *
 * `is_bulk_print` (DECISIONS #68, specs/bulk-print.md) marks the template as its module's
 * bulk-export default. Absent key → false; there is no migration/backfill. It is read
 * INDEPENDENTLY of layer1/criteria — a template may be bulk-flagged and also match normally.
 * §5: pdf_builder.html's parseStateApplication must expose this identically.
 */
function parseStateApp(raw) {
  const empty = { tokens: [], criteria: [], isBulkPrint: false };
  if (raw == null) return empty;
  const str = String(raw).trim();
  if (!str) return empty;
  if (str[0] === "{") {
    try {
      const obj = JSON.parse(str);
      if (obj && typeof obj === "object" && Number(obj.schemaVersion) >= 2) {
        return {
          tokens: Array.isArray(obj.layer1?.tokens) ? obj.layer1.tokens.map(t => String(t).trim()).filter(Boolean) : [],
          criteria: Array.isArray(obj.criteria) ? obj.criteria : [],
          isBulkPrint: obj.is_bulk_print === true,
        };
      }
    } catch (e) { /* fall through to legacy CSV */ }
  }
  return { tokens: str.split(",").map(s => s.trim()).filter(Boolean), criteria: [], isBulkPrint: false };
}

/** Read just the Layer-1 token CSV from a stored value (JSON or legacy CSV). */
function readLayer1Csv(raw) {
  return parseStateApp(raw).tokens.join(",");
}

/**
 * Serialize {tokens (CSV or array), criteria, isBulkPrint} → the JSON envelope string.
 *
 * `is_bulk_print` is emitted ONLY when true, so a non-bulk template's bytes are identical
 * to what every pre-bulk-print build wrote. schemaVersion stays 2 — this is an additive
 * optional key, not a shape change.
 */
function buildStateApp(tokens, criteria, isBulkPrint) {
  const tokenArr = Array.isArray(tokens)
    ? tokens.map(t => String(t).trim()).filter(Boolean)
    : String(tokens || "").split(",").map(s => s.trim()).filter(Boolean);
  return JSON.stringify({
    schemaVersion: STATE_APP_SCHEMA_VERSION,
    ...(isBulkPrint === true ? { is_bulk_print: true } : {}),
    layer1: { tokens: tokenArr },
    criteria: Array.isArray(criteria) ? criteria : [],
  });
}

function settingsLog(level, message, data) {
  const fn = level === "error" ? console.error : level === "warn" ? console.warn : console.log;
  if (data !== undefined) {
    fn("[PDF Settings] " + message, data);
  } else {
    fn("[PDF Settings] " + message);
  }
}

/**
 * Logs every API request and its full response.
 * Filter by "[API Output]" in the console to see only API traffic.
 */
function apiLog(description, url, method, response) {
  console.log(
    `[API Output] ${description}`,
    { request: `${method.toUpperCase()} ${url}`, response }
  );
}

function notifyUser(message, type = "warning") {
  if (window.facilioApp?.interface?.notify) {
    window.facilioApp.interface.notify({ message, type, duration: 3000, position: "top-right" });
  } else if (typeof ElementPlus !== "undefined" && ElementPlus.ElMessage) {
    ElementPlus.ElMessage({ type, message, duration: 3000 });
  } else {
    window.alert(message);
  }
}

function applyModuleVisibilityFilter(modules) {
  const whitelist = CONFIG.whitelistedModules || [];
  const blacklist = new Set(CONFIG.blacklistedModules || []);

  return modules.filter(m => {
    if (blacklist.has(m.name)) return false;

    const isCustom = m.custom === true || String(m.name || "").startsWith("custom_");

    if (isCustom) {
      if (CONFIG.showCustomModules) return true;
      return whitelist.includes(m.name);
    } else {
      if (whitelist.length === 0) return true;
      return whitelist.includes(m.name);
    }
  });
}

/** Parse total field count from GET /v1/setup/modules/fields/count (shape may vary by org). */
function parseFieldCountFromCountApi(resp) {
  const r = resp?.result;
  if (typeof r === "number" && Number.isFinite(r) && r >= 0) return Math.floor(r);
  if (r != null && typeof r.count === "number" && Number.isFinite(r.count)) return Math.floor(r.count);
  if (r != null && typeof r.fieldCount === "number" && Number.isFinite(r.fieldCount)) return Math.floor(r.fieldCount);
  if (r != null && typeof r.total === "number" && Number.isFinite(r.total)) return Math.floor(r.total);
  if (typeof resp?.data === "number" && Number.isFinite(resp.data)) return Math.floor(resp.data);
  const n = Number(r);
  if (Number.isFinite(n) && n >= 0) return Math.floor(n);
  return null;
}


function extractIncludeKey(fieldEntry) {
  return Object.keys(fieldEntry || {}).find(k => k.startsWith("include"));
}

function generateLocalId() {
  return "s" + Math.random().toString(36).slice(2, 9);
}

function pickRecordsArray(response, moduleKey) {
  const fromModuleKey = response?.data?.[moduleKey];
  const fromResultData = response?.result?.data;
  const fromDataArray = Array.isArray(response?.data) ? response.data : null;
  const fromList = response?.list;
  if (Array.isArray(fromModuleKey)) return fromModuleKey;
  if (Array.isArray(fromResultData)) return fromResultData;
  if (fromDataArray) return fromDataArray;
  if (Array.isArray(fromList)) return fromList;
  return [];
}

function pickFullRecord(response, moduleKey) {
  const wrapped = response?.data?.[moduleKey];
  if (wrapped && typeof wrapped === "object" && !Array.isArray(wrapped)) return wrapped;
  if (response?.data && typeof response.data === "object" && !Array.isArray(response.data)) return response.data;
  return response?.result || {};
}

function formatUser(v) {
  if (v == null) return "—";
  if (typeof v === "object") {
    if (v.name) return String(v.name);
    if (v.displayName) return String(v.displayName);
    if (v.email) return String(v.email);
  }
  return String(v);
}

function padTwoDigits(n) {
  return String(Math.floor(Math.abs(n))).padStart(2, "0");
}

/** List columns: Created / Modified — dd/MM/yyyy hh:mm a (local time, same pattern as pdf_builder dayjs) */
function formatListDate(ms) {
  if (ms == null || ms === "") return "—";
  const n = Number(ms);
  const d = new Date(Number.isFinite(n) ? n : ms);
  if (Number.isNaN(d.getTime())) return String(ms);
  const day = padTwoDigits(d.getDate());
  const month = padTwoDigits(d.getMonth() + 1);
  const year = d.getFullYear();
  let h24 = d.getHours();
  const min = padTwoDigits(d.getMinutes());
  const ampm = h24 >= 12 ? "pm" : "am";
  let h12 = h24 % 12;
  if (h12 === 0) h12 = 12;
  const hh = padTwoDigits(h12);
  return `${day}/${month}/${year} ${hh}:${min} ${ampm}`;
}

/** Best-effort message from SDK / axios errors (often empty on `Error` only). */
function formatApiError(err) {
  if (err == null) return "Unknown error";
  if (typeof err === "string") return err;
  const d = err.response?.data ?? err.data ?? err.result;
  if (d && typeof d === "object") {
    if (d.message) return String(d.message);
    if (d.error) return typeof d.error === "string" ? d.error : JSON.stringify(d.error);
    if (d.errors) return JSON.stringify(d.errors);
    try {
      return JSON.stringify(d).slice(0, 400);
    } catch (x) {
      return String(d);
    }
  }
  return err.message || String(err);
}

/**
 * #120 — READ A FIELD'S TYPE, in whichever shape this endpoint returned it.
 *
 * Mirrors the renderer's `fieldTypeName` (#119). The two apps read DIFFERENT endpoints:
 * settings uses `/v1/setup/modules/fields`, which returns `dataTypeEnum` as a plain STRING,
 * while the renderer's `/module/meta` returns it as an OBJECT carrying `_name`. Handling both
 * here costs one line and means neither app can be broken by the other's shape.
 * `dataType` is a NUMBER in both and is deliberately never decoded.
 */
function settingsFieldTypeName(f) {
  const e = f?.dataTypeEnum;
  if (typeof e === "string" && e.trim() !== "") return e.trim().toUpperCase();
  if (e && typeof e === "object" && typeof e._name === "string" && e._name.trim() !== "") {
    return e._name.trim().toUpperCase();
  }
  const d = f?.dataType;
  if (typeof d === "string" && d.trim() !== "") return d.trim().toUpperCase();
  return "";
}

/**
 * #120 — THE TYPE CHECK HERE NEVER RAN. It read `(f.dataType || f.dataTypeEnum)`, and
 * `dataType` is a NUMBER (9 for FILE) — truthy, so it won the `||`, stringified to "9", and
 * could never equal "FILE". Attachment and signature fields were therefore detected ONLY by
 * whether the word "attachment" appeared in the field name, which none of this org's do
 * (`signature`, `budget_head_approver_signature_quote`).
 *
 * The name test is gone rather than kept as a fallback: with the type read correctly it can
 * only ever ADD wrong answers — a text field called "attachmentNotes" is not a file. If a name
 * looks like an attachment but the platform says otherwise, that is logged, not acted on.
 */
function isAttachmentField(f) {
  if (settingsFieldTypeName(f) === "FILE") return true;
  if (String(f?.name || "").toLowerCase().includes("attachment")) {
    settingsLog(
      "warn",
      `Field "${f?.name}" is named like an attachment but the platform does not report it as FILE ` +
        `(type: ${settingsFieldTypeName(f) || "unknown"}). Treating it as an ordinary field (#120).`,
    );
  }
  return false;
}

/** Loads module_customizations.js before SDK init. Resolves even if file is missing. */
function loadModuleCustomizations() {
  return new Promise((resolve) => {
    if (window.MODULE_CUSTOMIZATIONS) { resolve(); return; } // already loaded
    const s = document.createElement("script");
    s.src = "./module_customizations.js";
    s.onload  = () => { resolve(); };
    s.onerror = () => {
      console.warn("[PDF Builder] module_customizations.js not found — no module overrides will apply.");
      resolve(); // non-fatal
    };
    document.head.appendChild(s);
  });
}

/** Loads org_customizations.js (the user customization layer). Resolves even if absent. */
function loadOrgCustomizations() {
  return new Promise((resolve) => {
    if (window.ORG_CUSTOMIZATIONS) { resolve(); return; }
    const s = document.createElement("script");
    s.src = "./org_customizations.js";
    s.onload  = () => resolve();
    s.onerror = () => {
      console.warn("[PDF Settings] org_customizations.js not found — no org customizations will apply.");
      resolve(); // non-fatal
    };
    document.head.appendChild(s);
  });
}

    const filteredSysMods = computed(() => {

    const filteredCustMods = computed(() => {

    function fieldIsCustom(f) {
      // Explicit boolean flags — highest priority

      if (f.isDefault === true || f.default === true) return false;
      if (f.isDefault === false || f.default === false) return true;
      // #120 — the old last resort was `name.startsWith("custom_")`, which is BACKWARDS for
      // this platform: Facilio marks a custom field with a module SUFFIX, not a prefix
      // (`technical_fm_approver_quote` is custom and starts with no such thing). So whenever
      // the flags above were absent it returned the wrong answer every time.
      //   No replacement guess is made, because there is no sound signal here: `inputName`
      // looked promising (`quote.data['…']`) but only SOME custom fields use that form — the
      // custom lookup `technical_fm_approver_quote` reports `quote.technical_fm_approver_quote.id`.
      //   Consequence of answering "not custom" is cosmetic and bounded: this decides only
      // which sidebar GROUP a field is listed under (`sysFieldsList` / `custFieldsList`); the
      // field is still listed and still addable either way. So we say so and move on.
      settingsLog(
        "warn",

    const fieldSplitReliable = computed(() => {

      const map = {
        comments: "Renders all comments and replies for this record.",

        workorderHistory: "The record's activity timeline, exactly as the History tab shows it — who did what and when, newest first. Covers status changes, SLA activations and breaches, PM-created work orders, and per-field create/update entries. Audit fields (Created/Modified Time, Approval State, and the like) are left out of the per-field lists. Hidden entirely when the record has no history.",
        // The four below are RETIRED from the picker (#109) and kept only so already-saved
        // templates still show a description instead of the "Custom section (…)" fallback.
        inspectionFindingDetails: "Per finding — Finding Details (Description, Space, Client, Inspection, Resolution Ownership, Priority, Is Work Order Required?, Assignee, Source of Finding).",
        inspectionFindingImage: "Per finding — finding image(s).",
        inspectionFindingComments: "Per finding — comments.",
        inspectionFindingAttachments: "Per finding — attachments.",
        customTable: "Org Customization — a backend-resolved data table (fixed column widths, string cells). Data comes from org_customizations.js; paginates with the page packer.",
        workorderPlans: "Up to 5 independent planned-cost tables (Items, Tools, Services, Labors, Misc), each fetched from its own API. Tables with no rows are omitted; the whole section is hidden if all 5 are empty. Independent from the existing Plans & Actuals cost-comparison preset.",
        workorderActuals: "Up to 5 independent actual-cost tables (Items, Tools, Services, Labors, Misc), each fetched from its own API. Tables with no rows are omitted; the whole section is hidden if all 5 are empty. Independent from the existing Plans & Actuals cost-comparison preset.",

    function defaultWidgetForParentField(f) {
      // #122 — was `return "image"` for EVERY file field, which defaulted a signature pad to
      // a photo box. The platform distinguishes the two through `displayType`, so read it.
      // A DEFAULT, not a lock: the author can switch the widget on the field card, and a
      // per-module `defaultWidgetTypes` entry still overrides this (see addField).
      // `isAttachmentField` still asks the "is this a file field at all" question, and still
      // carries the #120 warning for a field NAMED like an attachment that the platform does
      // not report as FILE. `settingsFileFieldWidgetKind` then answers "which kind". The
      // `|| "image"` cannot fire for a FILE field — it is the stated default, not dead code.
      if (isAttachmentField(f)) return settingsFileFieldWidgetKind(f) || "image";
      // #118 — a platform rich-text field defaults to the Rich Text widget, which prints its
      // stored HTML as HTML. `displayType` is the ONLY reliable marker: `dataTypeEnum` cannot
      // tell these apart (a single-line TEXTBOX and a multi-line TEXTAREA are both `STRING`,
      // and rich text arrives as `LARGE_TEXT`). Verified against live /module/meta.
      // A DEFAULT, not a lock — the author can switch the widget on the field card, and a
      // per-module `defaultWidgetTypes` entry still overrides this (see addField).
      if (isRichTextDisplayField(f)) return "richtext";
      const n = (f.name || "").toLowerCase();
      // #120 — was `(f.dataType || "") === "STRING"`, comparing against a NUMBER; the
      // condition could never be true, so only the exact-name test above it ever fired.
      if (n === "description" || (settingsFieldTypeName(f) === "STRING" && n.includes("desc"))) return "description";
      return "4col";
    }

    /**
     * #118 — is this a platform RICH_TEXT field?
     *
     * From live `/module/meta` on the quote module, the four text shapes are:
     *   subject                      dataTypeEnum STRING      displayType TEXTBOX   (1)
     *   description / notes          dataTypeEnum STRING      displayType TEXTAREA  (2)
     *   *_rejection_reason_*         dataTypeEnum BIG_STRING  displayType TEXTAREA  (2)
     *   test_rich_text_quote         dataTypeEnum LARGE_TEXT  displayType RICH_TEXT (73)
     * So `displayType` is the discriminator and `dataTypeEnum` is not: STRING covers both
     * single- and multi-line. The numeric `displayTypeInt` is checked too because some
     * payloads carry the int and a null string (e.g. externalId: null / -1, which correctly
     * falls through to the plain single-line default).
     */
    function isRichTextDisplayField(f) {
      if (settingsDisplayTypeName(f) === "RICH_TEXT") return true;
      return settingsDisplayTypeInt(f) === 73;
    }

    /**
     * #120/#122 — `displayType` has the same two-shape problem as `dataTypeEnum` (#119): a
     * plain string on this endpoint, an object carrying `_name` on the renderer's. Both are
     * read, so this cannot silently stop working if the endpoints converge.
     *
     * Extracted in #122 because a SECOND caller now needs it (`settingsFileFieldWidgetKind`).
     * Two independent readers of the same two-shape field is exactly the drift #120 was
     * written about. Behaviour is unchanged from the inline version in
     * `isRichTextDisplayField`: a non-object, non-string or blank `displayType` yields "",
     * and a missing or non-numeric int yields NaN, so every comparison downstream is false.
     */
    function settingsDisplayTypeName(f) {
      const raw = f?.displayType;
      if (typeof raw === "string" && raw.trim() !== "") return raw.trim().toUpperCase();
      if (raw && typeof raw === "object" && typeof raw._name === "string" && raw._name.trim() !== "") {
        return raw._name.trim().toUpperCase();
      }
      return "";
    }
    function settingsDisplayTypeInt(f) {
      const n = f?.displayTypeInt;
      if (n != null && Number.isFinite(Number(n))) return Number(n);
      const raw = f?.displayType;
      if (raw && typeof raw === "object" && Number.isFinite(Number(raw.intValForDB))) {
        return Number(raw.intValForDB);
      }
      return NaN;
    }

    /**
     * #122 — "signature" | "image" for a platform FILE field, "" for anything else.
     * MIRRORS `fileFieldWidgetKind` in pdf_builder.html; keep the two in step.
     * `dataTypeEnum` is FILE for both kinds, so `displayType` is the only discriminator:
     * SIGNATURE (22) for a signature pad, FILE (57) for a photo/attachment field. Verified
     * against live /module/meta on two orgs. Anything else FILE defaults to image, which is
     * the wider treatment and is what this function already returned for every file field.
     */
    function settingsFileFieldWidgetKind(f) {
      if (settingsFieldTypeName(f) !== "FILE") return "";
      const name = settingsDisplayTypeName(f);
      if (name === "SIGNATURE") return "signature";
      if (name === "FILE") return "image";
      const i = settingsDisplayTypeInt(f);
      if (i === 22) return "signature";
      if (i === 57) return "image";
      settingsLog(
        "info",
        `File field "${f?.name}" declares displayType "${name || i || "(unreadable)"}", which ` +
          `is not one this app knows. Defaulting its widget to Image (#122).`,
      );
      return "image";
    }

    function firstFieldsSection() {

    function addField(f) {
      if (isAdded(f.name)) return;
      const sec = firstFieldsSection();
      if (!sec) return;
      const customWidgetTypes = window.MODULE_CUSTOMIZATIONS?.[selModule.value?.name]?.settings?.defaultWidgetTypes || {};
      // #120 — the middle clause was `f.dataType === "STRING"` against a NUMBER: dead, never
      // true. It is now a real check, and it is also redundant with
      // `defaultWidgetForParentField`'s own description test — kept only because a name
      // CONTAINING "description" is a slightly wider net than that function's, and removing it
      // would narrow existing behaviour rather than restore it.
      const widgetType = customWidgetTypes[f.name]
        || (settingsFieldTypeName(f) === "STRING" && String(f.name || "").includes("description") ? "description" : null)
        || defaultWidgetForParentField(f);
      sec.fields.push({
        key: f.name,
        label: f.displayName || f.name,
        widgetType
      });
      settingsLog("info", "field added (parent)", { name: f.name, widgetType });
    }

    function toggleFindingPickerOption(optId, ev) {

    function confirmFindingPicker() {
      const fSections = window.MODULE_CUSTOMIZATIONS?.[selModule.value?.name]?.settings?.findingSections || [];
      for (const opt of fSections) {
        if (findingPickerSelected.value.has(opt.id) && !sections.value.some(s => s.type === opt.sectionType)) {
          sections.value.push({
            id: generateLocalId(),
            name: opt.sectionName,
            type: opt.sectionType,
            layout: "full",
            fields: [],
            isPreset: true,
            presetDescription: opt.description || `Finding — ${opt.label}. Rendered once per finding on the inspection.`,
          });
          settingsLog("info", `Finding section added: "${opt.sectionName}" (${opt.sectionType})`);
        }
      }
      closeFindingPicker();
    }

    function closePresetPicker() {
      presetPickerOpen.value = false;
      presetPickerSelected.value = new Set();
    }

    function togglePresetPickerOption(presetId, ev) {
      const checked = ev?.target?.checked;
      const next = new Set(presetPickerSelected.value);
      if (checked) next.add(presetId);
      else next.delete(presetId);
      presetPickerSelected.value = next;
    }

    function confirmPresetPicker() {
      for (const preset of modulePresetSections.value) {
        if (presetPickerSelected.value.has(preset.id)) {
          addPresetSection(preset);
        }
      }
      closePresetPicker();
    }

    function isPresetAlreadyAdded(preset) {
      // Non-fields special sections: check by sectionType (only one of each allowed)
      if (preset.section.sectionType !== "fields") {
        return sections.value.some(s => s.type === preset.section.sectionType);
      }
      // Fields-type presets: check by preset id — already added if a section
      // from this same preset was already pushed (name match as proxy).
      // Field-level deduplication does NOT apply to preset sections.
      return sections.value.some(
        s => s.isPreset && s.name === preset.section.sectionName
      );
    }

    function addPresetSection(preset) {
      const sec = preset.section;
      sections.value.push({
        id: generateLocalId(),
        name: sec.sectionName,
        type: sec.sectionType,
        layout: sec.layout === "half" ? "half" : "full",
        fields:
          sec.sectionType === "fields"
            ? sec.fields.map(f => ({ ...f }))
            : [],
        isPreset: true,
        presetDescription: preset.description || "",
        fieldsLocked: !!sec.fieldsLocked,
        estimatedHeight: sec.estimatedHeight ?? null,
      });
      settingsLog("info", `Preset section added: "${sec.sectionName}" (${sec.sectionType})`);
    }
    function isLockedPresetSection(sec) {
      return !!(sec?.isPreset || sec?.type !== "fields" || sec?.fieldsLocked);
    }

    // ── Org Customizations picker ───────────────────────────────────────
    function customizationDescription(type) {
      switch (type) {
        case "field":     return "Custom Field — a backend-resolved value rendered in a field-grid cell (choose the widget). Defined in org_customizations.js.";
        case "photo":     return "Custom Photo — a backend-resolved image (base64-embedded for mobile capture).";
        case "signature": return "Custom Signature — a two-column signer name + signature image widget.";
        case "table":     return "Custom Table — a backend-resolved data table using the product table styles (fixed column widths, paginates with the packer).";
        default:          return "Org customization.";
      }
    }

    function onCustomizationClick(e) {
      const willOpen = !customizationPickerOpen.value;
      attachmentPickerOpen.value = false;
      presetPickerOpen.value = false;
      findingPickerOpen.value = false;
      customizationPickerOpen.value = willOpen;
      customizationPickerSelected.value = new Set();
      if (willOpen) {
        // Seed widget choices for custom fields with their declared default.
        orgCustomFields.value.forEach(cf => {
          if (customizationFieldWidget[cf.id] == null) {
            customizationFieldWidget[cf.id] = cf.widgetType || "inline";
          }
        });
        openPicker(e?.currentTarget);
      }
    }

    function closeCustomizationPicker() {
      customizationPickerOpen.value = false;
      customizationPickerSelected.value = new Set();
    }

    function toggleCustomizationOption(id, ev) {
      const checked = ev?.target?.checked;
      const next = new Set(customizationPickerSelected.value);
      if (checked) next.add(id);
      else next.delete(id);
      customizationPickerSelected.value = next;
    }

    /** Is this customization already in the template? Fields/photos/sigs → field key; table → customTableId. */
    function isCustomizationAdded(item, kind) {
      if (kind === "table") {
        return sections.value.some(s => s.type === "customTable" && s.customTableId === item.id);
      }
      return isAdded(item.id);
    }

    function confirmCustomizationPicker() {
      const sel = customizationPickerSelected.value;
      const sec = firstFieldsSection();
      // Custom Fields — isPresetField rows with chosen widgetType.
      for (const cf of orgCustomFields.value) {
        if (!sel.has(cf.id) || isCustomizationAdded(cf, "field")) continue;
        if (!sec) { settingsLog("warn", "No fields section to add custom field"); continue; }
        sec.fields.push({ key: cf.id, label: cf.label, widgetType: customizationFieldWidget[cf.id] || cf.widgetType || "inline", isPresetField: true });
        settingsLog("info", "Custom Field added", { id: cf.id });
      }
      // Custom Photos — isPresetField rows forced to the image widget.
      for (const cp of orgCustomPhotos.value) {
        if (!sel.has(cp.id) || isCustomizationAdded(cp, "photo")) continue;
        if (!sec) continue;
        sec.fields.push({ key: cp.id, label: cp.label, widgetType: "image", isPresetField: true });
        settingsLog("info", "Custom Photo added", { id: cp.id });
      }
      // Custom Signatures — isPresetField rows forced to the signature widget.
      for (const cs of orgCustomSignatures.value) {
        if (!sel.has(cs.id) || isCustomizationAdded(cs, "signature")) continue;
        if (!sec) continue;
        sec.fields.push({ key: cs.id, label: cs.label, widgetType: "signature", isPresetField: true });
        settingsLog("info", "Custom Signature added", { id: cs.id });
      }
      // Custom Tables — dedicated customTable section referencing the customization id.
      for (const ct of orgCustomTables.value) {
        if (!sel.has(ct.id) || isCustomizationAdded(ct, "table")) continue;
        sections.value.push({
          id: generateLocalId(),
          name: ct.label || "Custom Table",
          type: "customTable",
          layout: "full",
          fields: [],
          isPreset: true,
          presetDescription: customizationDescription("table"),
          customTableId: ct.id,
        });
        settingsLog("info", "Custom Table section added", { id: ct.id });
      }
      closeCustomizationPicker();
    }

    // ── Table column picker (choose which columns a table-style section shows) ──
    // Two catalog sources today: org Custom Table (org_customizations.js) and the
    // Purchase Request Line Items native preset (module_customizations.js renderer.
    // lineItemsColumns). Any future table-with-a-picker preset should add a branch here
    // rather than a parallel picker — one mechanism, one storage shape (selectedColumns).
    /** Column catalog (key + header, minus always-on columns) for a pickable table section. */
    function customTableColumnCatalog(sec) {
      if (sec.type === "lineItems") {
        const catalog = window.MODULE_CUSTOMIZATIONS?.[selModule.value?.name]?.renderer?.lineItemsColumns;
        return Array.isArray(catalog) ? catalog.filter(c => !c.alwaysOn) : [];
      }
      const tables = orgCustomTables.value || [];
      const def = tables.find(t => t.id === sec.customTableId);
      return Array.isArray(def?.columns) ? def.columns : [];
    }
    /** Absent/empty selectedColumns → all columns shown (you cannot hide every column). */
    function isTableColumnSelected(sec, key) {
      if (!Array.isArray(sec.selectedColumns) || sec.selectedColumns.length === 0) return true;
      return sec.selectedColumns.includes(key);
    }
    function toggleTableColumn(sec, key, ev) {
      const checked = ev?.target?.checked;
      const allKeys = customTableColumnCatalog(sec).map(c => c.key);
      let selSet = Array.isArray(sec.selectedColumns) && sec.selectedColumns.length
        ? sec.selectedColumns.slice()
        : allKeys.slice();
      if (checked) { if (!selSet.includes(key)) selSet.push(key); }
      else { selSet = selSet.filter(k => k !== key); }
      // #126 — the EXISTING order is preserved and a newly-checked column is appended, where it
      // used to be re-sorted into catalog order on every toggle. That re-sort would silently
      // undo a re-ordering the moment the author toggled any column.
      const previousOrder = Array.isArray(sec.selectedColumns) && sec.selectedColumns.length
        ? sec.selectedColumns.filter(k => selSet.includes(k))
        : allKeys.filter(k => selSet.includes(k));
      for (const key of selSet) if (!previousOrder.includes(key) && allKeys.includes(key)) previousOrder.push(key);
      sec.selectedColumns = previousOrder;
      settingsLog("info", "Table columns changed", { type: sec.type, id: sec.customTableId || sec.id, selectedColumns: sec.selectedColumns });
    }

    /**
     * #126 — the picker's row order: the section's own column order, with the columns it does
     * not print appended at the bottom.
     *
     * `selectedColumns` is the single source of truth for BOTH which columns print and the order
     * they print in — deliberately not a second `columnOrder` key, which would be one more thing
     * to keep in step (§5) and could disagree with the selection. The cost of that choice is
     * that un-checking and re-checking a column sends it to the end; that is visible in this
     * list and undoable with the arrows, which is the right trade for one source of truth.
     */
    function orderedTableColumnsForPicker(sec) {
      const catalog = customTableColumnCatalog(sec);
      const selected = Array.isArray(sec.selectedColumns) ? sec.selectedColumns.filter(Boolean) : null;
      if (!selected || !selected.length) return catalog;
      const byKey = new Map(catalog.map(col => [col.key, col]));
      const ordered = [];
      const seen = new Set();
      for (const key of selected) {
        const col = byKey.get(key);
        if (!col || seen.has(key)) continue;
        ordered.push(col);
        seen.add(key);
      }
      for (const col of catalog) if (!seen.has(col.key)) ordered.push(col);
      return ordered;
    }
    /** #126 — materialize the order so it can be edited: absent selection means "all, in catalog order". */
    function materializeSelectedColumns(sec) {
      const selected = Array.isArray(sec.selectedColumns) ? sec.selectedColumns.filter(Boolean) : null;
      if (selected && selected.length) return selected.slice();
      return customTableColumnCatalog(sec).map(col => col.key);
    }
    /**
     * #128 — drag to reorder, replacing #126's ▲▼ buttons. Deliberately the same gesture, the
     * same `⠿` handle and the same drag states the field cards use, so the editor has ONE
     * ordering idiom rather than two.
     *
     * The drag state carries the SECTION id as well as the column key, because a template can
     * hold two sections of the same type (the two FMR sections do), each with its own picker —
     * without it, dragging in one would highlight a drop target in the other.
     *
     * Only an INCLUDED column is draggable or droppable: an unticked column has no position to
     * move, which is why it sits at the bottom of the list with its handle hidden.
     */
    function onColumnDragStart(sec, key, ev) {
      if (!isTableColumnSelected(sec, key)) return;
      dCol.value = { sec: sec.id, key };
      try {
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", "table-column");
      } catch (e) { /* noop */ }
    }
    function onColumnDragEnd() {
      dCol.value = null;
      dOverCol.value = null;
    }
    function dropOnColumn(sec, key) {
      const dragged = dCol.value;
      dCol.value = null;
      dOverCol.value = null;
      // Same-section only, and never onto a column that does not print.
      if (!dragged || dragged.sec !== sec.id || dragged.key === key) return;
      if (!isTableColumnSelected(sec, key)) return;
      const order = materializeSelectedColumns(sec);
      const from = order.indexOf(dragged.key);
      const to = order.indexOf(key);
      if (from < 0 || to < 0) return;
      order.splice(from, 1);
      // Dropping ONTO a row means "take its place": when the source was above the target, the
      // splice above has already shifted the target down one, so the recomputed index is used
      // rather than the original — the same correction `dropOnCard` makes for field cards.
      order.splice(order.indexOf(key) + (from < to ? 1 : 0), 0, dragged.key);
      sec.selectedColumns = order;
      settingsLog("info", "Table column reordered", { type: sec.type, id: sec.customTableId || sec.id, key: dragged.key, onto: key, selectedColumns: order });
    }

    function removeSection(sIdx) {
      const removed = sections.value[sIdx];
      sections.value.splice(sIdx, 1);
      settingsLog("info", "section removed", { idx: sIdx, type: removed?.type });
    }

    function onSecDragStart(idx, ev) {
      dSec.value = idx;
      try {
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", "sec");
      } catch (e) { /* noop */ }
    }
    function onSecDragEnd() {
      dSec.value = null;
      dOverSec.value = null;
    }
    function onSectionDragLeave(idx) {
      if (dOverSec.value === idx) dOverSec.value = null;
    }
    function dropOnSection(to) {
      const from = dSec.value;
      if (from === null || from === to) {
        dSec.value = null;
        dOverSec.value = null;
        return;
      }
      const moved = sections.value.splice(from, 1)[0];
      sections.value.splice(to, 0, moved);
      settingsLog("info", "section reordered", { from, to });
      dSec.value = null;
      dOverSec.value = null;
    }

    function onFieldDragStart(s, f, ev) {
      dField.value = { s, f };
      try {
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", "field");
      } catch (e) { /* noop */ }
    }
    function onFieldDragEnd() {
      dField.value = null;
      dOverField.value = null;
      dOverZone.value = null;
    }
    function onFieldCardDragLeave() {
      dOverField.value = null;
    }
    function dropOnZone(toS) {
      if (!dField.value) return;
      if (sections.value[toS]?.fieldsLocked) return;
      const { s: fromS, f: fromF } = dField.value;
      const field = sections.value[fromS].fields.splice(fromF, 1)[0];
      sections.value[toS].fields.push(field);
      settingsLog("info", "field moved to section zone", { fromS, toS, key: field.key });
      dField.value = null;
      dOverZone.value = null;
      dOverField.value = null;
    }
    function dropOnCard(toS, toF) {
      if (!dField.value) return;
      if (sections.value[toS]?.fieldsLocked || sections.value[dField.value.s]?.fieldsLocked) return;
      const { s: fromS, f: fromF } = dField.value;
      if (fromS === toS && fromF === toF) return;
      const field = sections.value[fromS].fields.splice(fromF, 1)[0];
      const adj = fromS === toS && fromF < toF ? toF - 1 : toF;
      sections.value[toS].fields.splice(adj, 0, field);
      settingsLog("info", "field reordered / cross-section", { fromS, fromF, toS, toF: adj, key: field.key });
      dField.value = null;
      dOverField.value = null;
      dOverZone.value = null;
    }

    function buildConfigObject() {
      const modLink = selModule.value?.name || "";
      return {
        templateName: templateName.value.trim(),
        moduleLinkName: modLink,
        sections: sections.value.map(s => ({
          sectionId: s.id,
          sectionName: s.name,
          sectionType: s.type,
          ...(s.layout === "half" ? { layout: "half" } : {}),
          ...(s.estimatedHeight != null ? { estimatedHeight: s.estimatedHeight } : {}),
          ...(s.isPreset ? { isPreset: true, presetDescription: s.presetDescription || "" } : {}),
          ...(s.type === "customTable" && s.customTableId ? { customTableId: s.customTableId } : {}),
          ...(Array.isArray(s.selectedColumns) ? { selectedColumns: s.selectedColumns } : {}),
          fields:
            s.type === "fields"
              ? s.fields.map(fc => {
                  const includeKey = "include" + fc.key;
                  const apiLabel = resolveLabelForKey(fc.key);
                  const row = { widgetType: fc.widgetType, [includeKey]: true };
                  if (fc.isSpacer) {
                    row.isSpacer = true;
                  } else if (fc.isPresetField) {
                    row.isPresetField = true;
                    row.customLabel = fc.label; // always persist label for preset fields
                  } else if (fc.label != null && String(fc.label).trim() !== "" && String(fc.label).trim() !== String(apiLabel || "").trim()) {
                    row.customLabel = fc.label;
                  }
                  return row;
                })
              : []
        }))
      };
    }

    function resolveLabelForKey(key) {
      const pf = parentFields.value.find(x => x.name === key);
      return pf?.displayName || key;
    }

    function hydrateSectionLabels() {
      sections.value.forEach(sec => {
        if (sec.type !== "fields" || !sec.fields) return;
        sec.fields.forEach(fc => {
          if (fc.isSpacer) return;
          if (!fc.label) fc.label = resolveLabelForKey(fc.key);
        });
      });
    }

    function parseStoredConfigToSections(raw) {
      let cfg = raw;
      if (!cfg) return [{ id: generateLocalId(), name: (selModule.value?.displayName || "Module") + " Details", type: "fields", fields: [] }];
      if (typeof cfg === "string") {
        try {
          cfg = JSON.parse(cfg);
        } catch (e) {
          settingsLog("error", "configJson parse failed", e);
          return [{ id: generateLocalId(), name: (selModule.value?.displayName || "Module") + " Details", type: "fields", fields: [] }];
        }
      }
      const out = [];
      for (const sec of cfg.sections || []) {
        const id = sec.sectionId || generateLocalId();
        const st = sec.sectionType;
        const _lay = sec.layout === "half" ? "half" : "full";
        if (st === "comments") {
          out.push({ id, name: sec.sectionName || "Comments", type: "comments", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "attachments") {
          out.push({ id, name: sec.sectionName || "Attachments", type: "attachments", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "woPhotos") {
          out.push({ id, name: sec.sectionName || "Work Order Photos", type: "woPhotos", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "otherAttachments") {
          out.push({ id, name: sec.sectionName || "Other Attachments", type: "otherAttachments", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "timeDetails") {
          out.push({ id, name: sec.sectionName || "Time Details", type: "timeDetails", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "timelog" || st === "statusLog") {
          out.push({ id, name: sec.sectionName || "Status Log", type: "statusLog", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "slaMetrics") {
          out.push({ id, name: sec.sectionName || "SLA Metrics", type: "slaMetrics", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "lineItems") {
          out.push({ id, name: sec.sectionName || "Line Items", type: "lineItems", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null, selectedColumns: Array.isArray(sec.selectedColumns) ? sec.selectedColumns : null });
          continue;
        }
        if (st === "customTable") {
          // Org Customization — references a customTables[] definition by id.
          out.push({ id, name: sec.sectionName || "Custom Table", type: "customTable", layout: _lay, fields: [], isPreset: true, presetDescription: sec.presetDescription || specialSectionDescription("customTable"), estimatedHeight: sec.estimatedHeight ?? null, customTableId: sec.customTableId || null, selectedColumns: Array.isArray(sec.selectedColumns) ? sec.selectedColumns : null });
          continue;
        }
        // Receivables (#59) — same render/measure family as customTable in pdf_builder.html,
        // but NOT the same column-picker family: the renderer builds their columns from
        // renderer.receivableReceiptsSection / receivableStockingSection and never reads
        // section.selectedColumns, and the editor's picker is gated to customTable/lineItems.
        // So selectedColumns is deliberately NOT carried here. If a column picker is ever
        // added for these, carrying it becomes part of THAT change (picker gate in the
        // section card + catalog in customTableColumnCatalog + renderer filter + this branch).
        if (st === "receivableReceipts") {
          out.push({ id, name: sec.sectionName || "Receipts", type: "receivableReceipts", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "receivableStocking") {
          out.push({ id, name: sec.sectionName || "Stocking", type: "receivableStocking", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        // Bill To / Ship To address (#99) — the sectionType string is itself the record
        // field name, so these carry no per-section config of their own and round-trip on
        // preset metadata alone (nothing extra for buildConfigObject to persist either).
        if (st === "billToAddress" || st === "shipToAddress") {
          const fallbackName = st === "billToAddress" ? "Billing Address" : "Shipping Address";
          out.push({ id, name: sec.sectionName || fallbackName, type: st, layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "assetLocation") {
          out.push({ id, name: sec.sectionName || "Asset / Location Details", type: "assetLocation", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "plansActuals") {
          out.push({ id, name: sec.sectionName || "Plans & Actuals", type: "plansActuals", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        // Workorder Plans / Actuals (#58) — 5-table declarative preset sections. The renderer
        // builds their tables from renderer.workorderPlansTables/workorderActualsTables and
        // carries no per-section column state, so these round-trip on preset metadata alone.
        if (st === "workorderPlans") {
          out.push({ id, name: sec.sectionName || "Plans", type: "workorderPlans", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "workorderActuals") {
          out.push({ id, name: sec.sectionName || "Actuals", type: "workorderActuals", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "tasks") {
          out.push({ id, name: sec.sectionName || "Tasks", type: "tasks", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        if (st === "workorderCost") {
          out.push({ id, name: sec.sectionName || "Work Order Costs", type: "workorderCost", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        // #112 — History. A decoder branch is MANDATORY for every sectionType, not optional:
        // without one the generic fallback further down rewrites the type to `fields` and
        // DESTROYS the section on the next save (#70), silently. See INSTRUCTIONS §5.
        if (st === "workorderHistory") {
          out.push({ id, name: sec.sectionName || "History", type: "workorderHistory", layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        // #109 — `inspectionFindingsList` is the current Findings preset. The four
        // `inspectionFinding*` types below it are RETIRED from the picker but MUST keep decoding:
        // templates saved before #109 still carry them, and without a branch here the generic
        // fallback further down rewrites them to `fields` and destroys them on save (#70).
        if (st === "inspectionScore" || st === "inspectionChecklist" ||
            st === "inspectionFindingsList" ||
            st === "inspectionFindingDetails" || st === "inspectionFindingImage" ||
            st === "inspectionFindingComments" || st === "inspectionFindingAttachments") {
          out.push({ id, name: sec.sectionName || st, type: st, layout: _lay, fields: [], isPreset: sec.isPreset || false, presetDescription: sec.presetDescription || "", estimatedHeight: sec.estimatedHeight ?? null });
          continue;
        }
        const fields = [];
        for (const entry of sec.fields || []) {
          const ik = extractIncludeKey(entry);
          if (!ik || !entry[ik]) continue;
          const key = ik.replace("include", "");
          const customLabel = entry.customLabel != null && String(entry.customLabel).trim() !== "" ? String(entry.customLabel).trim() : "";
          fields.push({
            key,
            label: customLabel,
            widgetType: entry.widgetType || "4col",
            ...(entry.isPresetField ? { isPresetField: true } : {}),
            ...(entry.isSpacer ? { isSpacer: true } : {}),
          });
        }
        const fieldKeys = fields.map(f => f.key);
        const fieldsLocked = keysMatchLockedFieldsPreset(fieldKeys);
        out.push({
          id,
          name: sec.sectionName || "Section",
          type: "fields",
          layout: _lay,
          fields,
          isPreset: sec.isPreset || false,
          presetDescription: sec.presetDescription || "",
          estimatedHeight: sec.estimatedHeight ?? null,
          ...(fieldsLocked ? { isPreset: true, fieldsLocked: true } : {}),
        });
      }
      if (!out.length) {
        out.push({ id: generateLocalId(), name: (selModule.value?.displayName || "Module") + " Details", type: "fields", fields: [] });
      }
      return out;
    }

    async function fetchTemplatesList() {
      const base =
        `/v3/modules/${CONFIG.templateModule}` +
        `?moduleName=${CONFIG.templateModule}`;
      // #105: the `page`/`perPage` LOOP is gone — ONE unbounded request, per the standing rule.
      // `withCount=true` is requested so the response's own total can be compared against what
      // arrived: an incomplete listing is not cosmetic here, because a missing template can hide
      // the default-match or bulk-print template and change which document an admin gets.
      const url = `${base}&withCount=true`;
      settingsLog("info", "API GET templates (unbounded, no page/perPage)", { url });
      const resp = await window.facilioApp.request.invokeFacilioAPI(url, { method: "GET" });
      settingsLog("info", "API GET templates (full response)", { resp });
      apiLog("Template listing", url, "GET", resp);
      if (resp?.error) {
        throw new Error("List templates failed: " + JSON.stringify(resp.error));
      }
      if (resp != null && resp.code != null && Number(resp.code) !== 0 && resp.code !== "0") {
        throw new Error("List templates API code: " + String(resp.code));
      }
      const acc = pickRecordsArray(resp, CONFIG.templateModule);
      const advertisedTemplateCount =
        resp?.meta?.pagination?.totalCount ?? resp?.meta?.pagination?.total ?? null;
      if (advertisedTemplateCount == null) {
        settingsLog("info", `templates: ${acc.length} record(s); no count in the response, so completeness is not verifiable.`);
      } else if (Number(advertisedTemplateCount) > acc.length) {
        settingsLog(
          "error",
          `Template listing TRUNCATED BY THE SERVER — ${advertisedTemplateCount} template(s) reported, ${acc.length} returned. No page/perPage was sent, so this is a server-side default limit. Templates past that limit are INVISIBLE in this editor, and a missing one may be the default-match or bulk-print template for its module.`,
          { count: advertisedTemplateCount, received: acc.length },
        );
      } else {
        settingsLog("info", `templates: ${acc.length} of ${advertisedTemplateCount} record(s) — complete.`);
      }
      // The list endpoint's field set follows the module's default view, which can vary per
      // org/module setup — some orgs' list responses omit custom fields entirely (e.g.
      // moduleLinkName/configJson/stateApplication) even though a single-record fetch always
      // returns them in full (fetchTemplateFullRecord, used by editTemplate, already proves
      // this). Enrich every row with its full record so list-driven logic (module grouping,
      // rule matching) can rely on these fields regardless of the list view's configuration —
      // mirrors pdf_builder.html's enrichTemplatesWithFullRecords().
      const enriched = await Promise.all(
        acc.map(async (row) => {
          try {
            const full = await fetchTemplateFullRecord(row.id);
            return full?.id ? { ...row, ...full } : row;
          } catch (e) {
            settingsLog("warn", "template list enrichment failed", { id: row.id, message: e.message });
            return row;
          }
        }),
      );
      templates.value = enriched;
      // #106: `pages: page` here referenced the loop counter #105 deleted, throwing
      // "page is not defined" AFTER the list had already loaded — which is why the symptom was
      // a failed bootstrap rather than a missing list. "(all pages)" is gone from the message
      // too: there are no pages any more, it is one unbounded request.
      settingsLog("info", "state: template list loaded", { count: enriched.length });
    }

    async function fetchTemplateFullRecord(id) {
      const url = `/v3/modules/${CONFIG.templateModule}/${id}?id=${id}&moduleName=${CONFIG.templateModule}`;
      settingsLog("info", "API GET single template record (start)", { id, url });
      const resp = await window.facilioApp.request.invokeFacilioAPI(url, { method: "GET" });
      settingsLog("info", "API GET single template record (full response)", { id, resp });
      apiLog("Single template enrichment", url, "GET", resp);
      return pickFullRecord(resp, CONFIG.templateModule);
    }

    /**
     * #105: the `page`/`perPage=100` LOOP is gone — one unbounded request per list, per the
     * standing rule. The loop worked, but it cost a round trip per 100 modules and it is the
     * same shape that silently truncated wherever someone omitted the loop (the renderer's own
     * moduleId fallback did exactly that, capped at 500 with no loop at all).
     */
    async function fetchAllModulePages(baseUrl, label) {
      const resp = await window.facilioApp.request.invokeFacilioAPI(baseUrl, { method: "GET" });
      const modules = resp?.result?.modules;
      if (!Array.isArray(modules)) {
        settingsLog("warn", `${label}: response carried no module array`, { baseUrl, resp });
        return [];
      }
      settingsLog("info", `${label}: ${modules.length} modules (unbounded, no page/perPage)`);
      return modules;
    }

    async function fetchModulesIfNeeded() {
      if (modulesCache.value != null) {
        settingsLog("info", "modules: using cache", { count: modulesCache.value.length });
        return modulesCache.value;
      }
      try {
        const [sysMods, custMods] = await Promise.all([
          fetchAllModulePages("/v1/setup/modules/lists/system", "system modules"),
          fetchAllModulePages("/v1/setup/modules/lists/custom", "custom modules"),
        ]);
        settingsLog("info", `modules fetched — system: ${sysMods.length}, custom: ${custMods.length}`);
        const all = [...sysMods, ...custMods].filter(m => m && m.name !== CONFIG.templateModule);
        modulesCache.value = all;
        settingsLog("info", "modules cached", { count: all.length });
        return all;
      } catch (e) {
        settingsLog("error", "module list fetch failed", { message: e.message, stack: e.stack });
        throw e;
      }
    }

    async function fetchAllFieldsForModule(moduleName) {
      const countUrl = `/v1/setup/modules/fields/count?moduleName=${encodeURIComponent(moduleName)}`;
      settingsLog("info", "API GET fields count (start)", countUrl);
      const countResp = await window.facilioApp.request.invokeFacilioAPI(countUrl, { method: "GET" });
      settingsLog("info", "API GET fields count (full response)", { moduleName, countResp });
      if (countResp?.error) {
        throw new Error("Fields count failed: " + JSON.stringify(countResp.error));
      }
      if (countResp != null && countResp.code != null && Number(countResp.code) !== 0 && countResp.code !== "0") {
        throw new Error("Fields count API code: " + String(countResp.code));
      }
      let total = parseFieldCountFromCountApi(countResp);
      if (total == null) {
        settingsLog("warn", "Could not parse fields count; check response.result shape", {
          moduleName,
          topKeys: Object.keys(countResp || {}),
          resultKeys: countResp?.result != null && typeof countResp.result === "object" ? Object.keys(countResp.result) : null
        });
        throw new Error("Fields count response shape not recognized. See console [PDF Settings] log.");
      }
      // #105: `page=1&perPage=${count}` REMOVED — this is the call the field-truncation bug was
      // reported against. Deriving `perPage` from the count API made the field list only ever as
      // complete as that count happened to be: if the count endpoint applied its own default
      // (100), we ASKED for 100 fields and every field past the hundredth vanished from the
      // editor's sidebar with no error — the admin simply could not find them. Requesting the
      // collection unbounded removes the dependency entirely. The count call is KEPT, but its job
      // is now purely to VERIFY: the mismatch check below is the shortfall detector.
      const fieldsUrl = `/v1/setup/modules/fields?moduleName=${encodeURIComponent(moduleName)}`;
      settingsLog("info", "API GET fields (unbounded, no page/perPage)", { moduleName, countForVerification: total, fieldsUrl });
      const resp = await window.facilioApp.request.invokeFacilioAPI(fieldsUrl, { method: "GET" });
      settingsLog("info", "API GET fields (full response)", { moduleName, resp });
      apiLog(`Module fields (${moduleName})`, fieldsUrl, "GET", resp);
      if (resp?.error) {
        throw new Error("Fields fetch failed: " + JSON.stringify(resp.error));
      }
      if (resp != null && resp.code != null && Number(resp.code) !== 0 && resp.code !== "0") {
        throw new Error("Fields fetch API code: " + String(resp.code));
      }
      const fields = resp?.result?.fields || [];
      if (total > 0 && fields.length < total) {
        settingsLog(
          "error",
          `Module fields TRUNCATED BY THE SERVER — ${total} field(s) reported by the count API, ${fields.length} returned. No page/perPage was sent, so this is a server-side default limit. Fields past that limit will be MISSING from the editor's field sidebar and cannot be added to a template. This endpoint needs a platform-side answer on its unbounded-fetch behaviour.`,
          { moduleName, count: total, received: fields.length },
        );
      } else if (fields.length !== total && total > 0) {
        // More returned than counted is harmless (a stale count), but worth seeing.
        settingsLog("warn", "fields list length differs from count API", { moduleName, count: total, received: fields.length });
      }
      settingsLog("info", "fields loaded in one request", { moduleName, count: total, received: fields.length });
      return fields;
    }

    async function fetchParentFields(moduleName) {

    async function saveTemplate() {
      const nameTrim = templateName.value.trim();
      if (!nameTrim) {
        notifyUser("Template name required.", "warning");
        settingsLog("warn", "save blocked: empty name");
        return;
      }
      if (!editingId.value && (!selModule.value || !selModule.value.name)) {
        notifyUser("Module missing — go back and select a module.", "warning");
        settingsLog("warn", "save blocked: no selModule");
        return;
      }
      const configObject = buildConfigObject();
      const jsonStr = JSON.stringify(configObject);
      saveBusy.value = true;
      try {
        const api = window.facilioApp?.api;
        if (!api?.createRecord || !api?.updateRecord) {
          throw new Error("facilioApp.api.createRecord / updateRecord not available on this SDK build.");
        }
        if (editingId.value) {
          const updatePayload = {
            id: editingId.value,
            data: {
              [CONFIG.fields.name]: nameTrim,
              [CONFIG.fields.configJson]: jsonStr
            }
          };
          settingsLog("info", "api.updateRecord (start)", { module: CONFIG.templateModule, payload: updatePayload });
          const resp = await api.updateRecord(CONFIG.templateModule, updatePayload);
          settingsLog("info", "api.updateRecord (full response)", resp);
          const _updRec = resp?.[CONFIG.templateModule] || resp?.data?.[CONFIG.templateModule] || {};
          settingsLog("info", "api.updateRecord — saved record keys", Object.keys(_updRec));
          settingsLog("info", "api.updateRecord — configJson present in response?", CONFIG.fields.configJson in _updRec, "value type:", typeof _updRec[CONFIG.fields.configJson]);
          apiLog("Update template", `PUT /v3/modules/${CONFIG.templateModule}/${editingId.value}`, "PUT", resp);
          if (resp?.error) {
            throw new Error(typeof resp.error === "string" ? resp.error : JSON.stringify(resp.error));
          }
          if (resp != null && resp.code != null && Number(resp.code) !== 0 && resp.code !== "0") {
            throw new Error("Update failed code: " + String(resp.code));
          }
          notifyUser("Template updated successfully.", "success");
        } else {
          const createPayload = {
            data: {
              [CONFIG.fields.name]: nameTrim,
              [CONFIG.fields.moduleLinkName]: selModule.value.name,
              [CONFIG.fields.configJson]: jsonStr
            }
          };
          settingsLog("info", "api.createRecord (start)", { module: CONFIG.templateModule, payload: createPayload });
          const resp = await api.createRecord(CONFIG.templateModule, createPayload);
          settingsLog("info", "api.createRecord (full response)", resp);
          const _crtRec = resp?.[CONFIG.templateModule] || resp?.data?.[CONFIG.templateModule] || {};
          settingsLog("info", "api.createRecord — saved record keys", Object.keys(_crtRec));
          settingsLog("info", "api.createRecord — configJson present in response?", CONFIG.fields.configJson in _crtRec, "value type:", typeof _crtRec[CONFIG.fields.configJson]);
          apiLog("Create template", `POST /v3/modules/${CONFIG.templateModule}`, "POST", resp);
          if (resp?.error) {
            throw new Error(typeof resp.error === "string" ? resp.error : JSON.stringify(resp.error));
          }
          if (resp != null && resp.code != null && Number(resp.code) !== 0 && resp.code !== "0") {
            throw new Error("Create failed code: " + String(resp.code));
          }
          notifyUser("Template added successfully.", "success");
        }
        settingsLog("info", "state transition → list after save");
        editingId.value = null;
        appState.value = "loading";
        loadingMessage.value = "Refreshing list…";
        await fetchTemplatesList();
        appState.value = "list";

        settingsLog("error", "save failed", { message: e?.message, detail, stack: e?.stack, raw: e });
        notifyUser("Save failed: " + (detail || "see console").slice(0, 220), "error");
