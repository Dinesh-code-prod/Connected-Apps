<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Builder Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.css" />
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.full.min.js"></script>
  <script src="https://static.facilio.com/apps-sdk/beta/facilio_apps_sdk.min.js"></script>
  <style>
    :root{
      --el-color-primary:#3C229D;
      --el-color-primary-light-3:#5a3ab8;
      --el-color-primary-light-5:#7a5ecc;
    }
    [v-cloak] { display: none !important; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;overflow:hidden}
    body{
      font-family: Roboto, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background:#f1f5f9;color:#0f172a;font-size:14px;font-weight:400;line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }

    .mobile-block{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;background:#f8fafc}
    .mobile-block h1{font-size:18px;font-weight:600;margin-bottom:10px;color:#0f172a}
    .mobile-block p{color:#64748b;max-width:320px;font-weight:400}

    .app{display:flex;flex-direction:column;height:100vh;width:100%;min-width:100%;overflow:hidden}
    .app-header-wrap{
      flex-shrink:0;padding:13px 24px 11px;
      background:#f1f5f9;
    }
    .app-header-card{
      background:#fff;border:1px solid #e2e8f0;border-radius:8px;
      box-shadow:0 1px 2px rgba(15,23,42,.04);
      padding:13px 14px 11px;
    }
    .app-header-card__top{display:flex;align-items:flex-start;gap:10px}
    .app-header-card__titles{min-width:0;flex:1}
    .app-header-card__title{
      font-size:14px;font-weight:600;color:#0f172a;line-height:1.25;letter-spacing:-.01em;
    }
    .app-header-card__desc{
      margin-top:5px;font-size:11px;font-weight:400;color:#64748b;line-height:1.4;max-width:52rem;
    }
    .app-header-card__bottom{
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
      margin-top:11px;padding-top:10px;border-top:1px solid #f1f5f9;
    }
    .app-header-card__nav{display:flex;align-items:center;gap:6px;min-height:26px;min-width:0;flex:1}
    .app-header-card__actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
    /* Full-bleed separator under the header card (entire connected-app width) */
    .app-chrome-rule{
      flex-shrink:0;height:1px;background:#e2e8f0;
      width:100vw;min-width:100%;
      position:relative;left:50%;transform:translateX(-50%);
    }
    .logo-mark{width:29px;height:29px;background:#3C229D;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    /* Header actions — ~80% scale vs prior toolbar row */
    .btn-toolbar{
      min-width:95px;height:26px;padding:0 9px;font-size:12px;font-weight:500;
      display:inline-flex;align-items:center;justify-content:center;border-radius:6px;
    }
    .breadcrumb{display:flex;align-items:center;gap:5px;font-size:12px;color:#94a3b8}
    .breadcrumb__link{color:#3C229D;cursor:pointer}
    .breadcrumb__link:hover{text-decoration:underline}
    .breadcrumb__sep{color:#cbd5e1}
    .app-body{flex:1;overflow:hidden;display:flex;flex-direction:column}

    .state-loading,.state-error{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;padding:24px}
    .state-error{color:#b91c1c}
    .state-muted{color:#64748b;font-size:14px;font-weight:400;text-align:center;max-width:420px}
    .loader-dots{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
    .loader-dots span{
      width:8px;height:8px;border-radius:50%;background:#64748b;
      animation:loader-dot 1.1s ease-in-out infinite both;
    }
    .loader-dots span:nth-child(1){animation-delay:0s}
    .loader-dots span:nth-child(2){animation-delay:.15s}
    .loader-dots span:nth-child(3){animation-delay:.3s}
    @keyframes loader-dot{
      0%,80%,100%{transform:translateY(0) scale(.65);opacity:.35}
      40%{transform:translateY(-4px) scale(1);opacity:1}
    }

    .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:all .15s;white-space:nowrap;line-height:1}
    .btn-primary{background:#3C229D;color:#fff;border-color:#3C229D}
    .btn-primary:hover{background:#2e1a7a}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .btn-secondary{background:#fff;color:#475569;border-color:#cbd5e1}
    .btn-secondary:hover{background:#f8fafc;border-color:#94a3b8}
    .btn-sm{padding:5px 12px;font-size:12px}

    .icon-action{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:transparent;cursor:pointer;border-radius:4px;color:#94a3b8;transition:color .12s,background .12s;padding:0}
    .icon-action--list{width:31px;height:31px}
    .icon-action--list svg{width:16px;height:16px;flex-shrink:0}
    .icon-action:hover{background:#f1f5f9;color:#475569}
    .icon-action.danger:hover{background:#fef2f2;color:#dc2626}
    .actions-cell{display:flex;align-items:center;gap:2px}

    .view-wrap{flex:1;overflow-y:auto;padding:20px 24px}
    .view-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
    .view-title{font-size:15px;font-weight:600;color:#0f172a;flex-shrink:0}
    .state-loading .view-title{font-size:14px;font-weight:500;color:#475569}
    .view-toolbar__right{display:flex;align-items:center;gap:10px}
    .search-box{position:relative;display:flex;align-items:center}
    .search-box svg{position:absolute;left:9px;color:#94a3b8;pointer-events:none}
    .search-input{padding:7px 10px 7px 30px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;font-weight:400;font-family:inherit;outline:none;color:#0f172a;background:#fff;width:220px}
    /* Editor field library only: match meta inputs — 13px (+1 vs .field-row__name 12px) */
    .sidebar .search-input{padding:6px 10px 6px 28px;font-size:13px}
    .search-input:focus{border-color:#3C229D;box-shadow:0 0 0 3px rgba(60,34,157,.08)}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
    .tbl{width:100%;border-collapse:collapse;font-size:14px;font-weight:400}
    .tbl thead th{
      background:#f8fafc;padding:12px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#64748b;border-bottom:1px solid #e2e8f0;white-space:nowrap;
    }
    .tbl thead th.num-col{width:48px;text-align:center}
    .tbl thead th.actions-col{width:100px}
    .tbl tbody td{padding:10px 14px;border-bottom:1px solid #f1f5f9;color:#0f172a;vertical-align:middle}
    .tbl tbody tr:last-child td{border-bottom:none}
    .tbl tbody tr:hover td{background:#fafafa}
    .tbl .num-cell{text-align:center;color:#94a3b8;font-size:13px;font-weight:400}
    .module-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500;background:#ede9fe;color:#3C229D}
    .defaults-cell-pill{
      display:inline-flex;align-items:center;padding:4px 14px;border-radius:9999px;
      background:#f1f5f9;color:#94a3b8;font-size:13px;font-weight:500;
      cursor:pointer;transition:background .15s;user-select:none;
    }
    .defaults-cell-pill:hover{background:#e2e8f0}
    .defaults-cell-pill--assigned{
      background:#ede9fe;color:#3C229D;gap:6px;padding:4px 10px 4px 14px;
      max-width:160px;
      align-items:flex-start;
    }
    .defaults-cell-pill--assigned:hover{background:#ddd6fe}
    .defaults-cell-pill__text{
      display:-webkit-box;
      -webkit-line-clamp:2;
      line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      word-break:break-word;
      min-width:0;
      flex:1;
    }
    .defaults-cell-pill__remove{
      display:inline-flex;align-items:center;justify-content:center;
      width:16px;height:16px;border-radius:9999px;border:none;background:transparent;
      color:#3C229D;font-size:14px;line-height:1;cursor:pointer;padding:0;flex-shrink:0;
      opacity:.7;transition:opacity .15s,background .15s;
    }
    .defaults-cell-pill__remove:hover{opacity:1;background:rgba(60,34,157,.15)}
    .tbl-name{font-weight:500;color:#0f172a;font-size:14px}
    .tbl-meta{font-size:13px;font-weight:400;color:#64748b}
    .pagination-wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid #f1f5f9;background:#fafafa}
    .page-info{font-size:13px;font-weight:400;color:#64748b}
    .pg{display:flex;align-items:center;gap:3px}
    .pg-btn{min-width:28px;height:28px;padding:0 6px;border:none;background:transparent;border-radius:4px;font-size:13px;color:#64748b;cursor:pointer;font-family:inherit;transition:background .12s,color .12s}
    .pg-btn:hover:not(:disabled):not(.active){background:#f1f5f9;color:#0f172a}
    .pg-btn.active{background:#f1f5f9;color:#0f172a;font-weight:600}
    .pg-btn:disabled{opacity:.35;cursor:not-allowed}

    .module-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;padding:0 2px;margin-top:18px;margin-bottom:8px}
    .modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
    .module-card{
      min-height:54px;padding:18px 21px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;transition:all .15s;
      display:flex;align-items:center;
    }
    .module-card:hover{border-color:#3C229D;background:#faf8ff;transform:translateY(-1px);box-shadow:0 2px 8px rgba(60,34,157,.08)}
    .module-card__name{font-size:14px;font-weight:500;color:#0f172a}

    .editor{display:flex;flex:1;overflow:hidden;min-height:0}
    .meta-bar{
      background:rgba(241,245,249,.85);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid #e2e8f0;
      border-top:1px solid #e2e8f0;
      padding:11px 20px;
      display:flex;
      align-items:flex-end;
      gap:16px;
      flex-shrink:0;
      box-shadow:0 2px 8px rgba(15,23,42,.05);
    }
    .meta-label{
      font-size:10px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.07em;
      color:#64748b;
      margin-bottom:4px;
    }
    .meta-input{
      padding:7px 12px;
      border:1.5px solid #cbd5e1;
      border-radius:8px;
      font-size:12px;
      font-weight:300;
      font-family:inherit;
      outline:none;
      color:#0f172a;
      width:280px;
      background:#fff;
      box-shadow:0 1px 3px rgba(15,23,42,.06);
      transition:border-color .15s,box-shadow .15s;
    }
    .meta-input:focus{
      border-color:#3C229D;
      box-shadow:0 0 0 3px rgba(60,34,157,.1);
    }
    .meta-input::placeholder{
      color:#cbd5e1;
    }
    .meta-readonly{
      padding:7px 12px;
      border:1.5px solid #e2e8f0;
      border-radius:8px;
      font-size:12px;
      font-weight:400;
      color:#334155;
      background:#f8fafc;
      box-shadow:0 1px 3px rgba(15,23,42,.04);
      min-width:180px;
    }

    .sidebar{width:290px;flex-shrink:0;border-right:1px solid #e2e8f0;background:#fff;display:flex;flex-direction:column;overflow:hidden}
    .sidebar-top{padding:10px 12px;border-bottom:1px solid #f1f5f9}
    .sidebar-scroll{flex:1;overflow-y:auto;min-height:0}

    .accordion-l1{border-bottom:1px solid #f1f5f9}
    .accordion-l1-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px;cursor:pointer;user-select:none;background:#f8fafc}
    .accordion-l1-head:hover{background:#f1f5f9}
    .accordion-l1-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#475569}
    .accordion-l2{border-bottom:1px solid #f8fafc}
    .accordion-l2-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 20px;cursor:pointer;user-select:none;transition:background .1s}
    .accordion-l2-head:hover{background:#f8fafc}
    .accordion-l2-title{font-size:12px;font-weight:600;color:#334155}
    .acc-count{font-size:10px;color:#94a3b8;background:#f1f5f9;padding:1px 6px;border-radius:8px;margin-left:auto;margin-right:6px}
    .acc-chevron{color:#94a3b8;font-size:11px;transition:transform .15s;flex-shrink:0}
    .acc-chevron.open{transform:rotate(90deg)}
    .acc-body{padding:4px 8px 10px 20px;display:flex;flex-direction:column;gap:6px}
    /* LHS field library — each field in a small separated “component” box */
    .field-row{
      display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;gap:8px;
      transition:background .12s,border-color .12s,box-shadow .12s;
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      border:1px solid rgba(226,232,240,.95);
      box-shadow:0 1px 2px rgba(15,23,42,.05),inset 0 1px 0 rgba(255,255,255,.9);
    }
    .field-row:hover{background:rgba(255,255,255,.95);border-color:#cbd5e1;box-shadow:0 2px 8px rgba(15,23,42,.07)}
    .field-row__info{display:flex;flex-direction:column;min-width:0;flex:1}
    .field-row__name{font-size:12px;color:#0f172a;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .field-row.is-added .field-row__name{color:#94a3b8}
    .field-add-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;color:#475569;font-size:13px;font-weight:500;flex-shrink:0;transition:all .12s;line-height:1;padding:0}
    .field-add-btn:hover:not(.added){border-color:#475569;background:#f1f5f9}
    .field-add-btn.added{border-color:#cbd5e1;background:#f8fafc;color:#94a3b8;cursor:default}

    .builder{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-height:0}
    .section-block{border:1px solid #e2e8f0;border-radius:8px;background:#fff;overflow:hidden;transition:border-color .12s,box-shadow .12s}
    .section-block.drag-over{border-color:#3C229D;box-shadow:0 0 0 2px rgba(60,34,157,.12)}
    .section-block.dragging{opacity:.35}
    .section-head{display:flex;align-items:center;gap:7px;padding:11px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
    .section-head--locked{background:#f1f5f9}
    .section-head__lock{display:inline-flex;align-items:center;justify-content:center;color:#64748b;flex-shrink:0;line-height:0}
    .section-name-text{flex:1;min-width:0;font-size:12px;font-weight:600;color:#334155;line-height:1.35}
    .drag-handle{cursor:grab;color:#cbd5e1;font-size:14px;flex-shrink:0;line-height:1;padding:2px}
    .drag-handle:hover{color:#94a3b8}
    .drag-handle:active{cursor:grabbing}
    .section-name-input{flex:1;padding:4px 7px;border:1px solid transparent;border-radius:4px;font-size:12px;font-weight:600;color:#334155;font-family:inherit;background:transparent;outline:none}
    .section-name-input:hover:not([readonly]){border-color:#cbd5e1;background:#fff}
    .section-name-input:focus:not([readonly]){border-color:#3C229D;background:#fff;box-shadow:0 0 0 2px rgba(60,34,157,.08)}
    .type-pill{
      font-size:11px;
      font-weight:500;
      padding:3px 8px;
      border-radius:10px;
      flex-shrink:0;
      letter-spacing:.02em;
      background:#f1f5f9;
      color:#475569;
    }
    .section-block--half .section-head{border-left:3px solid #7c3aed}
    .section-block--half .section-head::after{content:"½";font-size:10px;font-weight:700;color:#7c3aed;margin-left:auto;flex-shrink:0}
    .btn-layout-half{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid #e2e8f0;border-radius:4px;background:#fff;cursor:pointer;font-size:11px;font-weight:700;color:#94a3b8;flex-shrink:0;padding:0;font-family:inherit;transition:background .12s,border-color .12s,color .12s}
    .btn-layout-half:hover{border-color:#7c3aed;color:#7c3aed}
    .btn-layout-half.active{background:#ede9fe;border-color:#7c3aed;color:#7c3aed}
    .section-body{padding:8px}
    .drop-zone{min-height:36px;border-radius:5px;transition:background .1s,border .1s;border:1.5px dashed transparent}
    .drop-zone.over{background:#f5f3ff;border-color:#a78bfa}
    .field-card{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid #e2e8f0;border-radius:5px;background:#fff;margin-bottom:4px;cursor:default}
    .field-card:last-child{margin-bottom:0}
    .field-card.dragging{opacity:.3}
    .field-card.drop-target{border-top:2px solid #3C229D}
    .field-card--readonly{cursor:default;opacity:.95;background:#f8fafc}
    .field-card__name{flex:1;font-size:13px;font-weight:500;color:#0f172a;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .field-card__name-input {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      font-weight: 500;
      color: #0f172a;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 2px 5px;
      font-family: inherit;
      background: transparent;
      outline: none;
      cursor: text;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .field-card__name-input:hover {
      border-color: #e2e8f0;
      background: #f8fafc;
    }
    .field-card__name-input:focus {
      border-color: #3C229D;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(60, 34, 157, 0.08);
      white-space: normal;
    }
    /* Element Plus widget type select (aligned with createRfq el-select) */
    .field-card .pdf-settings-widget-select.el-select{width:128px;flex-shrink:0}
    .field-card .pdf-settings-widget-select .el-select__wrapper{
      min-height:32px;font-size:13px;font-family:Roboto,"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    }
    .pdf-settings-widget-popper.el-select__popper,.pdf-settings-widget-popper.el-popper{z-index:10050!important}
    .pdf-settings-widget-popper .el-select-dropdown__item{font-size:13px}
    .section-empty{padding:10px;text-align:center;color:#cbd5e1;font-size:12px}
    .special-body{padding:10px 12px;font-size:12px;color:#94a3b8;font-style:italic}
    .tbl-col-picker{margin-top:10px;padding-top:8px;border-top:1px solid #e2e8f0;font-style:normal}
    .tbl-col-picker__title{font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
    .tbl-col-picker__item{display:inline-flex;align-items:center;gap:5px;margin:0 12px 6px 0;font-size:12px;color:#334155;cursor:pointer}
    .tbl-col-picker__item input{cursor:pointer}
    /* #126 — column RE-ORDERING. The picker became a vertical list so each row can carry its
       own move controls; it was a wrapping inline row of checkboxes before. */
    .tbl-col-picker__list{display:flex;flex-direction:column;gap:3px;margin-top:2px}
    .tbl-col-picker__row{display:flex;align-items:center;gap:7px;font-size:12px;color:#334155}
    .tbl-col-picker__row--hidden{opacity:.55}
    .tbl-col-picker__label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;min-width:0}
    .tbl-col-picker__pos{flex:0 0 auto;width:16px;text-align:right;font-size:10px;color:#94a3b8;font-variant-numeric:tabular-nums}
    /* #128 — the row is DRAGGED, not nudged with arrows: the same affordance, classes and
       visual states as the field cards above (`.field-card.dragging` / `.drop-target`), because
       the developer asked for one ordering gesture across the editor, not two. */
    .tbl-col-picker__row{border:1px solid transparent;border-radius:5px;padding:2px 4px;background:#fff}
    .tbl-col-picker__row--draggable{cursor:default}
    .tbl-col-picker__row--dragging{opacity:.3}
    .tbl-col-picker__row--drop-target{border-top:2px solid #3C229D}
    .tbl-col-picker__hint{font-size:11px;color:#94a3b8;margin-top:6px;font-style:normal}
    .section-remove-btn{flex-shrink:0;margin-left:auto}
    .add-bar{display:flex;gap:8px;flex-wrap:wrap}
    .add-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1.5px dashed #cbd5e1;border-radius:6px;font-size:12px;color:#64748b;background:transparent;cursor:pointer;font-family:inherit;transition:all .15s}
    .add-btn:hover{border-color:#3C229D;color:#3C229D;background:#faf8ff}
    .add-btn:disabled{opacity:.4;cursor:not-allowed}
    .add-spacer-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border:1.5px dashed #cbd5e1;border-radius:6px;font-size:12px;color:#94a3b8;background:transparent;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:6px}
    .add-spacer-btn:hover{border-color:#94a3b8;color:#475569;background:#f8fafc}
    .att-picker-wrap { position: relative; }
    .att-picker {
      position: fixed;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 12px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.1);
      min-width: 260px; z-index: 9000; display: flex; flex-direction: column; gap: 8px;
    }
    .att-picker__title { font-size: 11px; font-weight: 600; color: #64748b; }
    .att-picker__option {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #334155; cursor: pointer;
    }
    .att-picker__option input { cursor: pointer; accent-color: #3C229D; }
    .att-picker__list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 220px; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    .att-picker__list::-webkit-scrollbar { width: 4px; }
    .att-picker__list::-webkit-scrollbar-track { background: transparent; }
    .att-picker__list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    /* Default-rule editor (#35): fixed dialog height + scrollable multi-select tag areas */
    .rule-editor-dialog .el-dialog__body { max-height: 60vh; overflow-y: auto; }
    .rule-where-select .el-select__selection,
    .rule-where-select .el-select__tags { max-height: 92px; overflow-y: auto; align-content: flex-start; }
    .rule-where-select .el-select__selection::-webkit-scrollbar,
    .rule-where-select .el-select__tags::-webkit-scrollbar { width: 4px; }
    .rule-where-select .el-select__selection::-webkit-scrollbar-thumb,
    .rule-where-select .el-select__tags::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .att-picker__actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:8888;display:flex;align-items:center;justify-content:center}
    .modal{background:#fff;border-radius:10px;padding:24px;width:360px;box-shadow:0 16px 48px rgba(0,0,0,.18)}
    .modal-title{font-size:15px;font-weight:600;margin-bottom:8px}
    .modal-body{font-size:13px;color:#475569;margin-bottom:20px;line-height:1.5}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px}
    /* ── Glassmorphic confirm dialog ───────────────────────────────────── */
    .gc-overlay{position:fixed;inset:0;z-index:9200;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.28)}
    .gc-panel{background:#fff;border:1px solid rgba(15,23,42,.1);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.08);width:440px;max-width:calc(100vw - 40px);overflow:hidden}
    .gc-header{display:flex;align-items:flex-start;justify-content:space-between;padding:28px 28px 0}
    .gc-title{font-size:16px;font-weight:700;color:#0f172a;letter-spacing:-.015em;line-height:1.3}
    .gc-close{flex-shrink:0;margin-left:16px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(15,23,42,.07);color:#64748b;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
    .gc-close:hover{background:rgba(15,23,42,.14);color:#0f172a}
    .gc-body{padding:14px 28px 28px}
    .gc-body p{margin:0;font-size:14px;color:#475569;line-height:1.65}
    .gc-footer{padding:16px 28px 24px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid rgba(15,23,42,.07)}
    .gc-btn-cancel{background:rgba(255,255,255,.6);border:1px solid rgba(15,23,42,.14);color:#334155;padding:9px 22px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s;backdrop-filter:blur(4px)}
    .gc-btn-cancel:hover{background:rgba(255,255,255,.9);border-color:rgba(15,23,42,.22)}
    .gc-btn-confirm{background:linear-gradient(135deg,#4a2db8 0%,#3C229D 100%);border:1px solid rgba(255,255,255,.18);color:#fff;padding:9px 22px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(60,34,157,.4),inset 0 1px 0 rgba(255,255,255,.18);transition:box-shadow .15s,background .15s}
    .gc-btn-confirm:hover:not(:disabled){background:linear-gradient(135deg,#5535cc 0%,#4a2db8 100%);box-shadow:0 6px 20px rgba(60,34,157,.5),inset 0 1px 0 rgba(255,255,255,.2)}
    .gc-btn-confirm:disabled{opacity:.55;cursor:not-allowed}
    /* ── end glassmorphic confirm dialog ───────────────────────────────── */
    .preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9500;display:flex;align-items:center;justify-content:center}
    .preview-modal{background:#fff;border-radius:12px;width:88vw;max-width:860px;height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.28)}
    .preview-modal__head{padding:14px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#fff}
    .preview-modal__title{font-size:14px;font-weight:600;color:#0f172a}
    .preview-modal__meta{font-size:12px;color:#94a3b8;margin-left:8px;font-weight:400}
    .preview-modal__iframe{flex:1;min-height:0;border:none;width:100%;display:block;background:#f1f5f9}
    .preview-modal__foot{padding:12px 20px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:8px;background:#f8fafc;flex-shrink:0}
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <div v-if="appState === 'mobile-blocked'" class="mobile-block">
      <h1>Desktop only</h1>
      <p>PDF Builder Settings is only available on desktop browsers.</p>
    </div>

    <template v-else>
      <div class="modal-overlay" v-if="confirmDelete" @click.self="confirmDelete = null">
        <div class="modal">
          <div class="modal-title">Delete Template</div>
          <div class="modal-body">Delete <strong>{{ confirmDeleteLabel }}</strong>? This cannot be undone.</div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary btn-sm" @click="confirmDelete = null">Cancel</button>
            <button type="button" class="btn btn-sm" style="background:#dc2626;color:#fff;border:none" @click="doDelete">Delete</button>
          </div>
        </div>
      </div>

      
      <!-- Preview modal -->
      <!-- #88: `previewFeatureEnabled` first so the modal + its iframe are never created
           when the feature is off — nothing loads ./pdf_builder.html?preview=1 at all. -->
      <div v-if="previewFeatureEnabled && previewOpen" class="preview-overlay" @click.self="closePreview">
        <div class="preview-modal">
          <div class="preview-modal__head">
            <div style="display:flex;align-items:baseline;gap:0">
              <span class="preview-modal__title">{{ templateName || 'Untitled' }}</span>
              <span class="preview-modal__meta">— {{ selModule?.displayName }} · Preview</span>
            </div>
            <button type="button" class="icon-action" @click="closePreview" style="width:28px;height:28px;font-size:16px">×</button>
          </div>
          <iframe
            ref="previewIframeRef"
            class="preview-modal__iframe"
            src="./pdf_builder.html?preview=1"
            @load="onPreviewIframeLoad"
          ></iframe>
          <div class="preview-modal__foot">
            <template v-if="previewTriggeredBySave">
              <button type="button" class="btn btn-secondary btn-sm" @click="closePreview">Back to Edit</button>
              <button type="button" class="btn btn-primary btn-sm" :disabled="saveBusy" @click="confirmSaveFromPreview">{{ saveBusy ? 'Saving…' : 'Save Template' }}</button>
            </template>
            <button v-else type="button" class="btn btn-secondary btn-sm" @click="closePreview">Close</button>
          </div>
        </div>
      </div>

      <div class="app">
        <div class="app-header-wrap">
          <div class="app-header-card">
            <div class="app-header-card__top">
              <div class="logo-mark" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <div class="app-header-card__titles">
                <h1 class="app-header-card__title">PDF Builder Settings</h1>
                <p class="app-header-card__desc">Configure and manage document layouts, metadata, and export preferences for generated PDF files.</p>
              </div>
            </div>
            <div class="app-header-card__bottom">
              <div class="app-header-card__nav">
                <div class="breadcrumb" v-if="appState === 'modules' || appState === 'editor'">
                  <span class="breadcrumb__link" @click="goList">Templates</span>
                  <span class="breadcrumb__sep">›</span>
                  <span style="color:#64748b">{{ appState === 'modules' ? 'Select Module' : (editingId ? 'Edit Template' : 'New Template') }}</span>
                </div>
                <span v-else-if="appState === 'list'" style="font-size:11px;color:#94a3b8;font-weight:400">Template library</span>
                <span v-else-if="appState === 'defaults'" style="font-size:11px;color:#94a3b8;font-weight:400">Default template configuration</span>
              </div>
              <div class="app-header-card__actions">
                <template v-if="appState === 'list'">
                  <button type="button" class="btn btn-secondary btn-toolbar" @click="openDefaults">Default Templates</button>
                  <button type="button" class="btn btn-primary btn-toolbar" @click="startCreate">+ New Template</button>
                </template>
                <button v-if="appState === 'defaults'" type="button" class="btn btn-secondary btn-toolbar" @click="goBackFromDefaults">← Back to Templates</button>
                <template v-if="appState === 'editor'">
                  <button type="button" class="btn btn-secondary btn-toolbar" @click="cancelEditor">Cancel</button>
                  <button v-if="previewFeatureEnabled" type="button" class="btn btn-secondary btn-toolbar" @click="openPreview(false)">Preview</button>
                  <button type="button" class="btn btn-primary btn-toolbar" :disabled="saveBusy" @click="openPreview(true)">{{ saveBusy ? 'Saving…' : 'Save Template' }}</button>
                </template>
              </div>
            </div>
          </div>
        </div>
        <div class="app-chrome-rule" aria-hidden="true"></div>

        <div class="app-body">
          <div v-if="appState === 'loading'" class="state-loading">
            <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="view-title">{{ loadingMessage }}</div>
            <div class="state-muted">Connecting to Facilio…</div>
          </div>

          <div v-else-if="appState === 'error'" class="state-error">
            <div class="view-title" style="color:inherit">{{ errorMessage }}</div>
            <button type="button" class="btn btn-primary" @click="retryBootstrap">Retry</button>
          </div>

          <div class="view-wrap" v-else-if="appState === 'list'">
            <div class="view-toolbar">
              <div class="view-title">Templates <span style="font-weight:400;font-size:12px;color:#94a3b8">({{ filteredTemplates.length }})</span></div>
              <div class="view-toolbar__right">
                <div class="search-box">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  <input class="search-input" v-model="listSearch" placeholder="Search templates..." />
                </div>
              </div>
            </div>

            <div class="card">
              <div style="overflow-x:auto">
                <table class="tbl">
                  <thead>
                    <tr>
                      <th class="num-col">#</th>
                      <th>Template Name</th>
                      <th>Module</th>
                      <th>Created By</th>
                      <th>Created Date</th>
                      <th>Modified By</th>
                      <th>Modified Date</th>
                      <th class="actions-col"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="(tpl, i) in pagedTemplates" :key="tpl.id">
                      <td class="num-cell">{{ (listPage - 1) * PAGE_SIZE + i + 1 }}</td>
                      <td><div class="tbl-name">{{ rowName(tpl) }}</div></td>
                      <td><span class="module-badge">{{ moduleDisplayForRow(tpl) }}</span></td>
                      <td class="tbl-meta">{{ formatUser(tpl.sysCreatedBy || tpl.createdBy) }}</td>
                      <td class="tbl-meta">{{ formatListDate(tpl.sysCreatedTime || tpl.createdTime) }}</td>
                      <td class="tbl-meta">{{ formatUser(tpl.sysModifiedBy || tpl.modifiedBy) }}</td>
                      <td class="tbl-meta">{{ formatListDate(tpl.sysModifiedTime || tpl.modifiedTime) }}</td>
                      <td>
                        <div class="actions-cell">
                          <button type="button" class="icon-action icon-action--list" title="Edit" @click="editTemplate(tpl)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                          </button>
                          <button type="button" class="icon-action icon-action--list danger" title="Delete" @click="openDelete(tpl)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                          </button>
                        </div>
                      </td>
                    </tr>
                    <tr v-if="!filteredTemplates.length">
                      <td colspan="8" style="text-align:center;color:#94a3b8;padding:32px">No templates found</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="pagination-wrap" v-if="filteredTemplates.length > PAGE_SIZE">
                <span class="page-info">Showing {{ (listPage - 1) * PAGE_SIZE + 1 }}–{{ Math.min(listPage * PAGE_SIZE, filteredTemplates.length) }} of {{ filteredTemplates.length }}</span>
                <div class="pg">
                  <button type="button" class="pg-btn" :disabled="listPage <= 1" @click="listPage--">‹</button>
                  <template v-for="p in totalPages" :key="p">
                    <button type="button" class="pg-btn" :class="{ active: p === listPage }" @click="listPage = p">{{ p }}</button>
                  </template>
                  <button type="button" class="pg-btn" :disabled="listPage >= totalPages" @click="listPage++">›</button>
                </div>
              </div>
            </div>
          </div>

          <div class="view-wrap" v-else-if="appState === 'defaults'">
            <div class="view-toolbar">
              <div class="view-title">Default Templates</div>
            </div>

            <div class="meta-bar" style="margin-bottom:14px;border-radius:8px;border:1px solid #e2e8f0">
              <div>
                <div class="meta-label">Select Module</div>
                <el-select
                  v-model="defaultsModule"
                  class="pdf-settings-widget-select"
                  popper-class="pdf-settings-widget-popper"
                  placeholder="Choose a module…"
                  style="width:280px"
                  :disabled="defaultsUpdateBusy"
                  @change="onDefaultsModuleChange"
                >
                  <el-option
                    v-for="opt in defaultsModuleOptions"
                    :key="opt.value"
                    :label="opt.label"
                    :value="opt.value"
                  />
                </el-select>
              </div>
            </div>

            <div v-if="defaultsLoading" class="state-loading" style="padding:48px 24px">
              <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
              <div class="view-title">Loading…</div>
            </div>

            <!-- ── Per-template rule list ── -->
            <template v-else-if="defaultsModule">
              <div style="position:relative">
                <!-- Saving overlay -->
                <div
                  v-if="defaultsUpdateBusy"
                  style="position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.65);border-radius:8px"
                >
                  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
                    <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
                    <span style="font-size:12px;color:#6d4fd8;font-weight:500">Saving…</span>
                  </div>
                </div>

                <div v-if="!defaultsModuleTemplates.length" class="card" style="padding:32px;text-align:center">
                  <div class="special-body" style="padding:0">No templates for this module.</div>
                </div>
                <div v-else style="display:flex;flex-direction:column;gap:8px">
                  <div
                    v-for="tpl in defaultsModuleTemplates"
                    :key="tpl.id"
                    class="field-row"
                    style="justify-content:space-between;align-items:flex-start"
                  >
                    <div class="field-row__info">
                      <div class="field-row__name" style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                        <span>{{ rowName(tpl) }}</span>
                        <span
                          v-if="isTemplateBulkPrint(tpl)"
                          style="background:#ede9fe;border:1px solid #ddd6fe;color:#5b21b6;border-radius:9999px;padding:1px 9px;font-size:10.5px;font-weight:600;letter-spacing:.02em"
                        >Bulk print</span>
                      </div>
                      <div style="font-size:11px;color:#94a3b8;margin-top:2px">
                        <template v-if="ruleHasScatteredTokens(tpl)">
                          <span style="color:#f59e0b;font-weight:500">⚠ Legacy tokens (scattered) — open to simplify</span>
                        </template>
                        <template v-else-if="ruleConditionCount(tpl) > 0">
                          {{ ruleSummary(tpl) }}
                        </template>
                        <template v-else>
                          <span style="color:#94a3b8">No rule — template never auto-loaded</span>
                        </template>
                      </div>
                    </div>
                    <button
                      type="button"
                      class="btn btn-secondary btn-toolbar"
                      :disabled="defaultsUpdateBusy"
                      @click="openRuleEditor(tpl)"
                    >{{ ruleConditionCount(tpl) > 0 || ruleHasScatteredTokens(tpl) ? 'Edit rule' : 'Add rule' }}</button>
                  </div>
                </div>
              </div>
            </template>

            <div v-else-if="!defaultsModule" class="card" style="padding:32px;text-align:center">
              <div class="special-body" style="padding:0">Select a module to configure default templates.</div>
            </div>

            <!-- ── Unified rule editor dialog (v2 guided form) ── -->
            <el-dialog v-model="ruleEditorOpen" class="rule-editor-dialog" :title="'When should “' + ruleEditorTemplateName + '” be the default?'" width="600px" @closed="closeRuleEditor">
              <div v-if="criteriaFieldsLoading" class="state-loading" style="padding:24px">
                <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
                <div class="view-title" style="font-size:13px">Loading fields…</div>
              </div>
              <template v-else>
                <!-- Plain-English summary banner -->
                <div style="background:#ede9fe;border:1px solid #ddd6fe;border-radius:8px;padding:11px 14px;font-size:12.5px;color:#3b2a7a;margin-bottom:18px;line-height:1.55" v-html="ruleEditorSummary"></div>

                <!-- Scattered-token warning banner -->
                <div v-if="ruleEditorScattered" style="background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#92400e">
                  <strong>Legacy token layout detected.</strong> These tokens were assigned via the old matrix and don't form a clean cross-product.
                  Click <strong>"Simplify rule"</strong> to convert them into a best-effort condition set, or close to keep them as-is.
                  <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
                    <span
                      v-for="tok in ruleEditorScatteredTokens"
                      :key="tok"
                      style="background:#fff;border:1px solid #f59e0b;border-radius:9999px;padding:2px 10px;font-size:11px;color:#92400e"
                    >{{ tok }}</span>
                  </div>
                  <button type="button" class="btn btn-secondary btn-toolbar" style="margin-top:10px" @click="simplifyScatteredRule">Simplify rule</button>
                </div>

                <!-- ── Where it applies block ── -->
                <div style="margin-bottom:22px">
                  <div style="font-size:12px;font-weight:700;color:#0f172a;margin-bottom:3px">Where it applies</div>
                  <div style="font-size:11px;color:#94a3b8;margin-bottom:12px">Choose the app, who's viewing, and the record status. Leave any field blank to apply broadly.</div>
                  <!-- #113: the same rule now also drives the Summary-tab render, so admins
                       are told here rather than discovering it. Copy only — no logic. -->
                  <div style="font-size:11px;color:#94a3b8;margin-bottom:12px">This rule also decides which template a record's <strong>Summary tab</strong> shows. If nothing matches there, the module's first template is shown and the reader can switch with the picker above the document.</div>
                  <div style="display:flex;flex-direction:column;gap:12px">
                    <!-- App -->
                    <div style="display:flex;align-items:center;gap:12px">
                      <label style="width:72px;font-size:12px;color:#64748b;font-weight:600;flex-shrink:0">App</label>
                      <el-select
                        :model-value="ruleApp"
                        multiple
                        class="rule-where-select"
                        placeholder="Any app"
                        clearable
                        style="flex:1"
                        popper-class="pdf-settings-widget-popper"
                        @update:model-value="setRuleApp"
                      >
                        <el-option
                          v-for="opt in predefinedFieldOptions('__app__')"
                          :key="opt.value"
                          :label="opt.label"
                          :value="opt.value"
                        />
                      </el-select>
                    </div>
                    <!-- Role -->
                    <div style="display:flex;align-items:center;gap:12px">
                      <label style="width:72px;font-size:12px;color:#64748b;font-weight:600;flex-shrink:0">Role</label>
                      <el-select
                        :model-value="ruleRoles"
                        multiple
                        class="rule-where-select"
                        placeholder="Anyone"
                        clearable
                        style="flex:1"
                        popper-class="pdf-settings-widget-popper"
                        @update:model-value="setRuleRoles"
                      >
                        <el-option
                          v-for="opt in predefinedFieldOptions('__role__')"
                          :key="opt.value"
                          :label="opt.label"
                          :value="opt.value"
                        />
                      </el-select>
                    </div>
                    <!-- Status -->
                    <div style="display:flex;align-items:center;gap:12px">
                      <label style="width:72px;font-size:12px;color:#64748b;font-weight:600;flex-shrink:0">Status</label>
                      <el-select
                        :model-value="ruleStates"
                        multiple
                        class="rule-where-select"
                        placeholder="Any status"
                        clearable
                        style="flex:1"
                        popper-class="pdf-settings-widget-popper"
                        @update:model-value="setRuleStates"
                      >
                        <el-option
                          v-for="opt in predefinedFieldOptions('__state__')"
                          :key="opt.value"
                          :label="opt.label"
                          :value="opt.value"
                        />
                      </el-select>
                    </div>
                  </div>
                </div>

                <!-- ── Only when… (module-field conditions) ── -->
                <div style="margin-bottom:8px">
                  <div style="font-size:12px;font-weight:700;color:#0f172a;margin-bottom:3px">Only when… <span style="font-weight:400;color:#94a3b8">(optional)</span></div>
                  <div style="font-size:11px;color:#94a3b8;margin-bottom:12px">Add field conditions to narrow further — e.g. only when Type is Reactive. All conditions must match.</div>

                  <div v-if="!moduleConditionRows.length" style="font-size:12px;color:#94a3b8;font-style:italic;padding:2px 0 10px">
                    No field conditions — applies to all records in the statuses above.
                  </div>

                  <div
                    v-for="(row, idx) in moduleConditionRows"
                    :key="idx"
                    style="display:flex;gap:8px;align-items:center;margin-bottom:8px"
                  >
                    <!-- Field selector (module fields only) -->
                    <el-select
                      v-model="row.field"
                      placeholder="Field…"
                      filterable
                      style="width:160px"
                      popper-class="pdf-settings-widget-popper"
                      @change="onRuleFieldChange(row)"
                    >
                      <el-option
                        v-for="f in criteriaFields"
                        :key="f.name"
                        :label="f.displayName || f.name"
                        :value="f.name"
                      />
                    </el-select>
                    <!-- Operator selector -->
                    <el-select
                      v-model="row.operatorLabel"
                      placeholder="Operator"
                      style="width:110px"
                      popper-class="pdf-settings-widget-popper"
                      :disabled="!row.field"
                      @change="onRuleOperatorChange(row)"
                    >
                      <el-option
                        v-for="op in ruleOperatorsForRow(row)"
                        :key="op.label"
                        :label="op.label"
                        :value="op.label"
                      />
                    </el-select>
                    <!-- Multi-value picker -->
                    <el-select
                      v-if="ruleRowIsMulti(row)"
                      v-model="row.value"
                      multiple
                      placeholder="Values"
                      filterable
                      style="flex:1;min-width:130px"
                      popper-class="pdf-settings-widget-popper"
                      :loading="!!criteriaLookupLoading[row.field]"
                      :disabled="!row.field"
                      @change="onRuleValueChange(row)"
                    >
                      <el-option
                        v-for="opt in ruleRowValueOptions(row)"
                        :key="opt.value"
                        :label="opt.label"
                        :value="opt.value"
                      />
                    </el-select>
                    <!-- Single-value picker -->
                    <el-select
                      v-else
                      :model-value="row.value[0] || ''"
                      placeholder="Value"
                      filterable
                      style="flex:1;min-width:130px"
                      popper-class="pdf-settings-widget-popper"
                      :loading="!!criteriaLookupLoading[row.field]"
                      :disabled="!row.field"
                      @update:model-value="v => { row.value = v ? [v] : []; onRuleValueChange(row); }"
                    >
                      <el-option
                        v-for="opt in ruleRowValueOptions(row)"
                        :key="opt.value"
                        :label="opt.label"
                        :value="opt.value"
                      />
                    </el-select>
                    <button type="button" class="btn btn-secondary btn-toolbar" style="padding:6px 10px;flex-shrink:0" @click="removeModuleConditionRow(idx)" title="Remove condition">&#x2715;</button>
                  </div>

                  <button type="button" class="btn btn-secondary btn-toolbar" style="margin-top:4px;font-size:12px" @click="addModuleConditionRow">+ Add field condition</button>
                </div>

                <!-- ── Bulk print (is_bulk_print) ── -->
                <div style="margin-top:18px;padding-top:16px;border-top:1px solid #e2e8f0">
                  <div style="font-size:12px;font-weight:700;color:#0f172a;margin-bottom:3px">Bulk print</div>
                  <div style="font-size:11px;color:#94a3b8;margin-bottom:10px">
                    Used when records are exported in bulk, where nobody is present to pick a template.
                    Independent of the conditions above — this template can be the bulk-print default
                    <em>and</em> still match normally. Only one template per module can hold this.
                  </div>
                  <el-checkbox v-model="ruleBulkPrint" style="font-size:12px">
                    Use this template when this module is bulk printed
                  </el-checkbox>
                  <div v-if="ruleBulkPrint && bulkPrintHolderName" style="margin-top:8px;font-size:11px;color:#92400e;background:#fef3c7;border:1px solid #f59e0b;border-radius:6px;padding:7px 10px">
                    <strong>{{ bulkPrintHolderName }}</strong> currently holds bulk print for this module. Saving will move it to this template.
                  </div>
                </div>
              </template>
              <template #footer>
                <div style="display:flex;align-items:center;justify-content:space-between">
                  <button
                    v-if="ruleConditionCount(ruleEditorTemplate) > 0 || ruleHasScatteredTokens(ruleEditorTemplate)"
                    type="button"
                    class="gc-btn-cancel"
                    style="color:#dc2626;border-color:#dc2626"
                    :disabled="ruleSaving"
                    @click="clearRule"
                  >Clear rule</button>
                  <span v-else></span>
                  <div style="display:flex;gap:8px">
                    <button type="button" class="gc-btn-cancel" @click="closeRuleEditor">Cancel</button>
                    <button type="button" class="gc-btn-confirm" :disabled="ruleSaving || criteriaFieldsLoading" @click="saveRule">
                      {{ ruleSaving ? 'Saving…' : 'Save rule' }}
                    </button>
                  </div>
                </div>
              </template>
            </el-dialog>
          </div>

          <div class="view-wrap" v-else-if="appState === 'modules'">
            <div class="view-toolbar">
              <div class="view-title">Select a Module</div>
              <div class="search-box">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input class="search-input" v-model="moduleSearch" placeholder="Search modules..." />
              </div>
            </div>

            <div class="module-section-label">System Modules</div>
            <div class="modules-grid">
              <div class="module-card" v-for="m in filteredSysMods" :key="m.name" @click="selectModule(m)">
                <div class="module-card__name">{{ m.displayName }}</div>
              </div>
            </div>
            <div class="module-section-label">Custom Modules</div>
            <div class="modules-grid">
              <div class="module-card" v-for="m in filteredCustMods" :key="m.name" @click="selectModule(m)">
                <div class="module-card__name">{{ m.displayName }}</div>
              </div>
            </div>
          </div>

          <template v-else-if="appState === 'editor'">
            <div class="meta-bar">
              <div>
                <div class="meta-label">Template Name</div>
                <input class="meta-input" v-model="templateName" placeholder="e.g. Work Order Full Report" />
              </div>
              <div>
                <div class="meta-label">Module</div>
                <div class="meta-readonly">{{ selModule?.displayName || '—' }}</div>
              </div>
            </div>

            <div class="editor">
              <div class="sidebar">
                <div class="sidebar-top">
                  <div class="search-box" style="width:100%">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="left:9px;position:absolute;color:#94a3b8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input class="search-input" style="width:100%;padding-left:28px" v-model="fieldSearch" placeholder="Search fields..." />
                  </div>
                </div>
                <div class="sidebar-scroll">
                  <div class="accordion-l1">
                    <div class="accordion-l1-head" @click="toggleAccordionLevel1('parent')">
                      <span class="accordion-l1-title">Parent Module Fields</span>
                      <span class="acc-chevron" :class="{ open: open.parent }">›</span>
                    </div>
                    <div v-if="open.parent">
                      <!-- fieldSplitReliable: suffix-count matches custom count → show split -->
                      <template v-if="fieldSplitReliable">
                        <div class="accordion-l2">
                          <div class="accordion-l2-head" @click="toggleAccordionLevel2('system')">
                            <span class="accordion-l2-title">System Fields</span>
                            <span class="acc-count">{{ filteredSysFields.length }}</span>
                            <span class="acc-chevron" :class="{ open: open.system }">›</span>
                          </div>
                          <div class="acc-body" v-if="open.system">
                            <div class="field-row" v-for="f in filteredSysFields" :key="f.name" :class="{ 'is-added': isAdded(f.name) }">
                              <div class="field-row__info">
                                <div class="field-row__name">{{ f.displayName }}</div>
                              </div>
                              <button type="button" class="field-add-btn" :class="{ added: isAdded(f.name) }" @click="addField(f)" :title="isAdded(f.name) ? 'Added' : 'Add field'">
                                {{ isAdded(f.name) ? '✓' : '+' }}
                              </button>
                            </div>
                          </div>
                        </div>
                        <div class="accordion-l2">
                          <div class="accordion-l2-head" @click="toggleAccordionLevel2('custom')">
                            <span class="accordion-l2-title">Custom Fields</span>
                            <span class="acc-count">{{ filteredCustFields.length }}</span>
                            <span class="acc-chevron" :class="{ open: open.custom }">›</span>
                          </div>
                          <div class="acc-body" v-if="open.custom">
                            <div class="field-row" v-for="f in filteredCustFields" :key="f.name" :class="{ 'is-added': isAdded(f.name) }">
                              <div class="field-row__info">
                                <div class="field-row__name">{{ f.displayName }}</div>
                              </div>
                              <button type="button" class="field-add-btn" :class="{ added: isAdded(f.name) }" @click="addField(f)">
                                {{ isAdded(f.name) ? '✓' : '+' }}
                              </button>
                            </div>
                          </div>
                        </div>
                      </template>
                      <!-- Fallback: categorization unreliable — show all fields under one group -->
                      <template v-else>
                        <div class="accordion-l2">
                          <div class="accordion-l2-head" @click="toggleAccordionLevel2('allFields')">
                            <span class="accordion-l2-title">Fields</span>
                            <span class="acc-count">{{ filteredAllFields.length }}</span>
                            <span class="acc-chevron" :class="{ open: open.allFields }">›</span>
                          </div>
                          <div class="acc-body" v-if="open.allFields">
                            <div class="field-row" v-for="f in filteredAllFields" :key="f.name" :class="{ 'is-added': isAdded(f.name) }">
                              <div class="field-row__info">
                                <div class="field-row__name">{{ f.displayName }}</div>
                              </div>
                              <button type="button" class="field-add-btn" :class="{ added: isAdded(f.name) }" @click="addField(f)" :title="isAdded(f.name) ? 'Added' : 'Add field'">
                                {{ isAdded(f.name) ? '✓' : '+' }}
                              </button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>

                </div>
              </div>

              <div class="builder">
                <div class="sections-list">
                  <div
                    v-for="(sec, sIdx) in sections"
                    :key="sec.id"
                    class="section-block"
                    :class="{ 'drag-over': dOverSec === sIdx && dSec !== sIdx, dragging: dSec === sIdx, 'section-block--half': sec.layout === 'half' }"
                    @dragover.prevent="dSec !== null && (dOverSec = sIdx)"
                    @drop.prevent="dropOnSection(sIdx)"
                    @dragleave="onSectionDragLeave(sIdx)"
                  >
                    <div
                      class="section-head"
                      :class="{ 'section-head--locked': isLockedPresetSection(sec) }"
                    >
                      <span class="drag-handle" draggable="true" @dragstart="onSecDragStart(sIdx, $event)" @dragend="onSecDragEnd" title="Drag to reorder">⠿</span>
                      <input v-if="(sec.type === 'fields' && !sec.fieldsLocked) || sec.type === 'customTable'" class="section-name-input" v-model="sec.name" />
                      <span v-else class="section-name-text">{{ sec.name }}</span>
                      <span v-if="isLockedPresetSection(sec)" class="section-head__lock" aria-hidden="true">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                      </span>
                      <span class="type-pill">{{ sectionTypeLabel(sec.type) }}</span>
                      <button
                        v-if="sec.type === 'fields' || sec.type === 'assetLocation' || sec.type === 'timeDetails' || sec.type === 'billToAddress' || sec.type === 'shipToAddress'"
                        type="button"
                        class="btn-layout-half"
                        :class="{ active: sec.layout === 'half' }"
                        @click="sec.layout = sec.layout === 'half' ? 'full' : 'half'"
                        title="Toggle half-width (place two sections side by side)"
                      >½</button>
                      <button
                        type="button"
                        class="icon-action danger section-remove-btn"
                        @click="removeSection(sIdx)"
                        title="Remove section"
                        style="width:24px;height:24px"
                      >
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                      </button>
                    </div>
                    <div class="section-body" v-if="sec.type === 'fields' && !sec.isPreset">
                      <div
                        class="drop-zone"
                        :class="{ over: dOverZone === sIdx }"
                        @dragover.prevent="dOverZone = sIdx"
                        @dragleave="dOverZone = null"
                        @drop.prevent="dropOnZone(sIdx)"
                      >
                        <div
                          v-for="(fc, fIdx) in sec.fields"
                          :key="fc.key"
                          class="field-card"
                          :class="{ dragging: dField && dField.s === sIdx && dField.f === fIdx, 'drop-target': dOverField && dOverField.s === sIdx && dOverField.f === fIdx, 'field-card--readonly': fc.isPresetField }"
                          draggable="true"
                          @dragstart="onFieldDragStart(sIdx, fIdx, $event)"
                          @dragend="onFieldDragEnd"
                          @dragover.prevent.stop="dOverField = { s: sIdx, f: fIdx }"
                          @dragleave.stop="onFieldCardDragLeave"
                          @drop.prevent.stop="dropOnCard(sIdx, fIdx)"
                        >
                          <span class="drag-handle" style="font-size:12px;cursor:grab">⠿</span>
                          <div style="flex:1;min-width:0">
                            <span v-if="fc.isSpacer" class="field-card__name-readonly" style="font-size:13px;color:#94a3b8;font-style:italic">Spacer</span>
                            <input
                              v-else
                              class="field-card__name-input"
                              v-model="fc.label"
                              placeholder="Field label"
                              @click.stop
                            />
                          </div>
                          <el-select
                            v-model="fc.widgetType"
                            class="pdf-settings-widget-select"
                            popper-class="pdf-settings-widget-popper"
                            size="small"
                            @change="settingsLog('info', 'widgetType changed', { key: fc.key, widgetType: fc.widgetType })"
                          >
                            <el-option
                              v-for="opt in widgetOptionsForField(fc)"
                              :key="opt.value"
                              :label="opt.label"
                              :value="opt.value"
                            />
                          </el-select>
                          <button type="button" class="icon-action danger" @click="sec.fields.splice(fIdx, 1)" style="width:22px;height:22px">
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                          </button>
                        </div>
                        <div class="section-empty" v-if="!sec.fields.length">Drop fields here or click + in the left panel</div>
                      </div>
                      <button type="button" class="add-spacer-btn" @click="addSpacer(sec)" title="Add blank spacer cell">+ Spacer</button>
                    </div>
                    <div class="special-body" v-else>
                      <div>{{ sec.presetDescription || specialSectionDescription(sec.type) }}</div>
                      <div v-if="(sec.type === 'customTable' || sec.type === 'lineItems') && customTableColumnCatalog(sec).length" class="tbl-col-picker">
                        <div class="tbl-col-picker__title">Columns to include &amp; order:</div>
                        <!-- #126 — the list is in the SECTION's order, not the catalog's, and the
                             arrows rewrite that order. Unchecked columns sink to the bottom and
                             lose their arrows: there is nothing to order about a column that does
                             not print. -->
                        <div class="tbl-col-picker__list">
                          <div
                            v-for="(col, ci) in orderedTableColumnsForPicker(sec)"
                            :key="col.key"
                            :class="['tbl-col-picker__row',
                                     isTableColumnSelected(sec, col.key) ? 'tbl-col-picker__row--draggable' : 'tbl-col-picker__row--hidden',
                                     dCol && dCol.sec === sec.id && dCol.key === col.key ? 'tbl-col-picker__row--dragging' : '',
                                     dOverCol && dOverCol.sec === sec.id && dOverCol.key === col.key ? 'tbl-col-picker__row--drop-target' : '']"
                            :draggable="isTableColumnSelected(sec, col.key)"
                            @dragstart="onColumnDragStart(sec, col.key, $event)"
                            @dragend="onColumnDragEnd"
                            @dragover.prevent.stop="isTableColumnSelected(sec, col.key) && (dOverCol = { sec: sec.id, key: col.key })"
                            @dragleave.stop="dOverCol = null"
                            @drop.prevent.stop="dropOnColumn(sec, col.key)"
                          >
                            <span v-if="isTableColumnSelected(sec, col.key)" class="drag-handle" style="font-size:12px;cursor:grab" title="Drag to reorder">⠿</span>
                            <span v-else class="drag-handle" style="font-size:12px;visibility:hidden">⠿</span>
                            <span class="tbl-col-picker__pos">{{ isTableColumnSelected(sec, col.key) ? (ci + 1) : '—' }}</span>
                            <label class="tbl-col-picker__label">
                              <input type="checkbox" :checked="isTableColumnSelected(sec, col.key)" @change="toggleTableColumn(sec, col.key, $event)" />
                              <!-- #90: `settingsLabel` wins here when a catalog defines one. The
                                   quote/invoice PDF headers dropped their "w/ markup" qualifier
                                   (the columns sit side by side, so the PDF reader can tell), but
                                   this picker would then show two identical "Unit price" and two
                                   identical "Amount" checkboxes with no way to know which is
                                   which. Falls back to `header`, so every other catalog is
                                   unaffected. -->
                              <span>{{ col.settingsLabel || col.header || col.key }}</span>
                            </label>

                          </div>
                        </div>
                        <div class="tbl-col-picker__hint">Drag to reorder — the top of this list prints as the left-most column.</div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="add-bar">
                  <button type="button" class="add-btn" @click="addSection">+ Add Section</button>
                  <button type="button" class="add-btn" :disabled="hasComments" @click="addSpecial('comments')">+ Comments</button>
                  <div class="att-picker-wrap">
                    <button
                      type="button"
                      class="add-btn"
                      :disabled="hasAttachments"
                      @click="onAttachmentsClick($event)"
                    >+ Attachments</button>

                    <div v-if="attachmentPickerOpen" class="att-picker" :style="pickerStyle">
                      <div class="att-picker__title">Select attachment types to add:</div>
                      <div class="att-picker__list">
                        <label
                          v-for="opt in moduleAttachmentSections"
                          :key="opt.id"
                          class="att-picker__option"
                        >
                          <input
                            type="checkbox"
                            :value="opt.id"
                            :checked="attachmentPickerSelected.has(opt.id)"
                            :disabled="sections.some(s => s.type === opt.sectionType)"
                            @change="toggleAttachmentPickerOption(opt.id, $event)"
                          />
                          {{ opt.label }}
                          <span v-if="sections.some(s => s.type === opt.sectionType)"
                                style="font-size:10px;color:#94a3b8;margin-left:4px">(already added)</span>
                        </label>
                      </div>
                      <div class="att-picker__actions">
                        <button type="button" class="add-btn" @click="closeAttachmentPicker">Cancel</button>
                        <button
                          type="button"
                          class="add-btn"
                          style="color:#3C229D;border-color:#3C229D"
                          :disabled="attachmentPickerSelected.size === 0"
                          @click="confirmAttachmentPicker"
                        >Add</button>
                      </div>
                    </div>
                  </div>
                  <div v-if="moduleFindingSections.length" class="att-picker-wrap">
                    <button
                      type="button"
                      class="add-btn"
                      :disabled="moduleFindingSections.every(o => sections.some(s => s.type === o.sectionType))"
                      @click="onFindingsClick($event)"
                    >+ Findings</button>

                    <div v-if="findingPickerOpen" class="att-picker" :style="pickerStyle">
                      <div class="att-picker__title">Select finding sections to add:</div>
                      <div class="att-picker__list">
                        <label
                          v-for="opt in moduleFindingSections"
                          :key="opt.id"
                          class="att-picker__option"
                        >
                          <input
                            type="checkbox"
                            :value="opt.id"
                            :checked="findingPickerSelected.has(opt.id)"
                            :disabled="sections.some(s => s.type === opt.sectionType)"
                            @change="toggleFindingPickerOption(opt.id, $event)"
                          />
                          {{ opt.label }}
                          <span v-if="sections.some(s => s.type === opt.sectionType)"
                                style="font-size:10px;color:#94a3b8;margin-left:4px">(already added)</span>
                        </label>
                      </div>
                      <div class="att-picker__actions">
                        <button type="button" class="add-btn" @click="closeFindingPicker">Cancel</button>
                        <button
                          type="button"
                          class="add-btn"
                          style="color:#3C229D;border-color:#3C229D"
                          :disabled="findingPickerSelected.size === 0"
                          @click="confirmFindingPicker"
                        >Add</button>
                      </div>
                    </div>
                  </div>
                  <div v-if="modulePresetSections.length" class="att-picker-wrap">
                    <button
                      type="button"
                      class="add-btn"
                      :disabled="modulePresetSections.every(p => isPresetAlreadyAdded(p))"
                      @click="onPresetClick($event)"
                    >+ Pre-set Customizations</button>

                    <div v-if="presetPickerOpen" class="att-picker" :style="pickerStyle">
                      <div class="att-picker__title">Add pre-set customizations:</div>
                      <div class="att-picker__list">
                        <label
                          v-for="preset in modulePresetSections"
                          :key="preset.id"
                          class="att-picker__option"
                        >
                          <input
                            type="checkbox"
                            :value="preset.id"
                            :checked="presetPickerSelected.has(preset.id)"
                            :disabled="isPresetAlreadyAdded(preset)"
                            @change="togglePresetPickerOption(preset.id, $event)"
                          />
                          {{ preset.label }}
                          <span v-if="isPresetAlreadyAdded(preset)"
                                style="font-size:10px;color:#94a3b8;margin-left:4px">(already added)</span>
                        </label>
                      </div>
                      <div class="att-picker__actions">
                        <button type="button" class="add-btn" @click="closePresetPicker">Cancel</button>
                        <button
                          type="button"
                          class="add-btn"
                          style="color:#3C229D;border-color:#3C229D"
                          :disabled="presetPickerSelected.size === 0"
                          @click="confirmPresetPicker"
                        >Add</button>
                      </div>
                    </div>
                  </div>
                  <div v-if="hasAnyOrgCustomizations" class="att-picker-wrap">
                    <button
                      type="button"
                      class="add-btn"

/**

 * leave the other live. Save still works with the flag off — `openPreview(true)` falls
 * straight through to `saveTemplate()`, which is the same function the preview footer's
 * confirm button calls, so the save path itself is identical either way and nothing about
 * what gets persisted changes.
 *
 * Renderer side: `pdf_builder.html`'s `?preview=1` mode is deliberately NOT touched by this
 * flag. It is inert unless something loads that URL, and with the flag off nothing does.
 */
const PREVIEW_FEATURE_ENABLED = false;

// ╔══════════════════════════════════════════════════════════════════╗

// ╚══════════════════════════════════════════════════════════════════╝

  // whitelistedModules: system modules to show. Empty [] = show all system modules.

  // blacklistedModules: always hidden regardless of other settings.

  // showCustomModules: true  = show all custom modules except blacklisted ones.
  //                   false = show only custom modules explicitly in whitelistedModules.
  showCustomModules: true,

// ═══════════════════════════════════════════════════════════════════

const PAGE_SIZE = 10;
const APP_LOADED_TIMEOUT_MS = 15000;
/** DEAD since #105 — the template listing no longer pages; it issues one unbounded request

 *  with the reason, not deleted) so the history of the 250-per-page loop is not erased. */
const TEMPLATES_FETCH_PER_PAGE = 250;
/** Safety guard if API keeps returning full pages (should not happen) */
/** DEAD since #105 — the runaway-pagination guard for a loop that no longer exists. Kept per
